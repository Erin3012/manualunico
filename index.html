<style>
/* Layout: single column app, bottom tab bar on phones, centered reading width on larger screens. */
:root{
  --bg:#F7F8FB; --surface:#FFFFFF; --ink:#14233D; --muted:#4A5A78; --line:#C9D2E3; --bar:#14233D;
  --accent:#14233D; --accent-ink:#FFFFFF; --accent-soft:#E3E8F2; --ok:#2F7D4B; --ok-soft:#DDEFE3; --bad:#B3262E; --bad-soft:#F7E1E2;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Work Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#17213A; --ink:#E9EEF8; --muted:#9AA8C4; --line:#2A3A5C; --bar:#070D18;
    --accent:#8EA8D6; --accent-ink:#0E1626; --accent-soft:#1E2D4D; --ok:#6FBF88; --ok-soft:#1E3A28; --bad:#E88A8F; --bad-soft:#3E2024;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17213A; --ink:#E9EEF8; --muted:#9AA8C4; --line:#2A3A5C; --bar:#070D18;
  --accent:#8EA8D6; --accent-ink:#0E1626; --accent-soft:#1E2D4D; --ok:#6FBF88; --ok-soft:#1E3A28; --bad:#E88A8F; --bad-soft:#3E2024;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);
  padding-left:max(0px, env(safe-area-inset-left,0px)); padding-right:max(0px, env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0 0 .5em}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0 0 .9em;max-width:65ch}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:#F7F8FB;border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.brand{font-family:var(--display);font-size:1.15rem;font-weight:600;margin:0}
.brand small{display:block;font:500 .75rem/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:#B9C4DA;margin-top:2px}

main{padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding-block:6px max(8px,env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 4px;border-radius:10px;font-size:.85rem;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.tap{display:block;width:100%;text-align:left;cursor:pointer}
.card.tap:hover{border-color:var(--accent)}
.meta{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.lead{color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.stat{flex:1 1 120px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:600 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}

.acordeon{margin-bottom:10px}
.acordeon>button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.acordeon>button span{display:block;font-size:.85rem;color:var(--muted)}
.acordeon ul{list-style:none;margin:6px 0 4px;padding:0 0 0 18px;border-left:2px solid var(--accent)}
.acordeon li button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;cursor:pointer;min-height:44px}
.acordeon li button:hover{border-color:var(--accent)}

.contenido p{margin-bottom:12px}
.contenido li{margin-bottom:6px}
.contenido strong{color:var(--accent);font-weight:700}

.progreso{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.progreso i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.opciones{display:grid;gap:10px;margin:14px 0}
.opcion{width:100%;text-align:left;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.35}
.opcion:not(:disabled):hover{border-color:var(--accent)}
.opcion:disabled{cursor:default}
.opcion.bien{border-color:var(--ok);background:var(--ok-soft)}
.opcion.mal{border-color:var(--bad);background:var(--bad-soft)}
.opcion.elegida{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.retro{border-radius:12px;padding:12px 14px;margin:6px 0 4px;border:1px solid}
.retro.bien{background:var(--ok-soft);border-color:var(--ok)}
.retro.mal{background:var(--bad-soft);border-color:var(--bad)}
.retro strong{display:block;margin-bottom:4px}

select,input[type=number]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;max-width:100%}
.fila-chip{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.revision{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.num{font-variant-numeric:tabular-nums}
.nota{font-size:.9rem;color:var(--muted)}
@media (min-width:720px){ .tabs{left:50%;transform:translateX(-50%);width:min(720px,100%);border-radius:14px 14px 0 0} }
/* Tinta azul: progreso por segmentos, etiquetas en rojo de tinta y bordes más rectos */
.segmentos{display:grid;grid-template-columns:repeat(auto-fill,minmax(9px,1fr));gap:3px;margin:8px 0 16px}
.segmentos i{height:8px;border-radius:2px;background:var(--line)}
.segmentos i.hecho{background:var(--accent)}
.meta{letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--bad)}
.btn{border-radius:8px}
.card{border-radius:10px}
.corazones{display:inline-flex;gap:6px;align-items:center;margin:4px 0 10px}
.corazon{width:28px;height:24px;shape-rendering:crispEdges}
.corazon rect{fill:currentColor}
.corazon.lleno{color:var(--bad)}
.corazon.vacio{color:var(--line)}
.flash-punto{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:700 64px/1 var(--display);pointer-events:none;z-index:50;animation:flash-punto .8s ease-out forwards}
.flash-punto.bien{color:var(--ok)}
.flash-punto.mal{color:var(--bad)}
@keyframes flash-punto{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
  .comentario{margin:12px 0;padding:10px 14px;border-left:4px solid #94a3b8;background:#f1f5f9;border-radius:6px;font-size:.95em;color:#334155}
</style>
</head>

            "Adicionalmente existen las denominadas atribuciones exclusivas del Congreso Pleno, aquellas que deben ser conocidas en un solo cuerpo por las dos ramas del Congreso Nacional. Por ejemplo, en caso de vacancia del cargo de Presidente de la República, el Congreso Pleno podrá elegirlo, siempre que falte menos de dos años para la próxima elección general presidencial.",
            "El proceso de formación de las leyes.",
            "La principal función del Congreso Nacional es debatir y aprobar las leyes. Si bien nuestra Constitución Política de la República no define expresamente lo que debe entenderse por ley, se extrae de la lectura del artículo 63 N° 20 que es toda norma de carácter general y obligatorio que estatuye las bases esenciales de un ordenamiento jurídico.",
            "Las leyes pueden tener origen tanto en la Cámara de Diputados, como en el Senado, por mensaje que dirija el Presidente de la República o por moción de cualquiera de sus miembros.",
            "El proceso legislativo está conformado por etapas sucesivas, a saber:",
            "a. La iniciativa.",
            "Es la etapa en que comienza el primer impulso para que una proposición sea analizada por el Congreso Nacional. Ello significa elaborar un proyecto que sea susceptible, por su forma y por su contenido, de convertirse en ley. En nuestro país tienen iniciativa de ley el Presidente de la República y los parlamentarios; en el primer caso se habla de Mensaje, en el segundo de Moción.",
            "b. La discusión.",
            "En ella se verifica el estudio, análisis y deliberación del Senado y en la Cámara de Diputados sobre un proyecto de ley, la cual pasa por distintas etapas. Una vez aprobado un proyecto en su Cámara de origen, pasa a la Cámara revisora, la cual procede de la misma manera como lo hizo la primera. Una vez aprobado por ambas, el proyecto es enviado al Presidente de la República.",
            "c. La sanción.",
            "Al Presidente de la República le es enviado el proyecto de ley aprobado por ambas Cámaras a efectos de que lo apruebe o rechace. Si no dice nada en un plazo de 30 días desde que recibió el proyecto de ley, se entiende que lo aprueba.",
            "d. La promulgación.",
            "Aprobado el proyecto de ley por el Presidente de la República, éste dicta un decreto promulgatorio dentro de un plazo de 10 días.",
            "e. La publicación.",
            "En el plazo de 5 días desde que queda tramitado el decreto promulgatorio, el texto de la ley debe publicarse en el Diario Oficial y, desde ese momento es obligatoria y se presume conocida por todos.",
            "En todo este proceso hay que considerar que la tramitación de una ley no está sujeta a un tiempo determinado. Sin embargo, un proyecto puede ser calificado con urgencia por el Presidente de la República y en tal caso, su discusión y votación en la Cámara requerida deberán quedar terminadas en el plazo de treinta días; si la calificación fuere de suma urgencia, ese plazo será de quince días y, si se solicitare discusión inmediata, será de seis días.",
            "Estos plazos corren desde la sesión de la Cámara correspondiente en que se dé cuenta del Mensaje u oficio que requiere la urgencia a una de las Cámaras.",
            "A continuación, se observa un esquema del procedimiento de formación de la ley:",
            "Notas:",
            "1. El esquema se trata de una explicación general y por ello, en casos específicos puede experimentar diferencias.",
            "Así, por ejemplo, algunas materias sólo pueden tener su origen en la Cámara de Diputados y otras sólo en el",
            "2.",
            "3.",
            "4. Senado. En tales casos, el Presidente de la República deberá enviar su Mensaje a la Cámara correspondiente.",
            "En el caso de las Mociones, éstas sólo pueden ser presentadas por parlamentarios que formen parte de la corporación respectiva.",
            "Salvo por acuerdo unánime de la sala de omitir este trámite. La Comisión discute en general el proyecto, habitualmente invita a expertos y a organizaciones de la sociedad civil a expresar su opinión sobre el mismo, luego de lo cual acuerda generalmente un plazo para que se presenten indicaciones. A continuación, se procede al análisis y votación en particular de las indicaciones y de los artículos del proyecto de ley uno a uno.",
            "Si el proyecto rechazado fuese de iniciativa del Presidente de la República, éste podrá solicitar que el Mensaje pase a la otra Cámara. En ésta, requerirá de la aprobación de dos tercios de sus miembros presentes. De aprobarse por ese quórum, retomará a la Cámara de Origen, donde sólo podrá volver a ser desechado con el voto de los dos tercios de sus miembros presentes.",
            "Las comisiones mixtas se crean al no producirse acuerdos entre las Cámaras.",
            "Cuando se da acuerdo en la comisión mixta, el proyecto vuelve a ser considerado por ambas Cámaras, donde requiere de la mayoría de sus miembros presentes para ser aprobado. En tal caso el proyecto es remitido al Presidente de la República.",
            "En caso de no haber acuerdo en la comisión mixta, o si su propuesta es rechazada en la Cámara de Origen, ésta puede insistir, a petición del Presidente de la República, en su proyecto anterior. Esta insistencia requiere de una mayoría de dos tercios de sus miembros presentes. Si la Cámara de Origen acuerda la insistencia, el proyecto pasa por segunda vez a la Cámara Revisora, el cual sólo podrá ser reprobado con el voto de los dos tercios de sus miembros presentes. De no lograr este quórum, el proyecto se da por aprobado y continúa su tramitación.",
            "5. Si el Presidente desaprueba el proyecto aprobado por el Congreso, formulando veto u observaciones, el proyecto es devuelto a la Cámara de Origen con las observaciones dentro del plazo de 30 días.",
            "Si ambas Cámaras apruebas las observaciones, el proyecto es devuelto al Ejecutivo para su promulgación como ley.",
            "Si las dos Cámaras rechazan todas o alguna de las observaciones del Presidente, e insistieren por los dos tercios de sus miembros presentes, en la totalidad o parte del proyecto aprobado por ellas, se devolverá el proyecto al Ejecutivo, el que debe promulgarlo como ley.",
            "En caso de ser rechazadas por las dos Cámaras todas o algunas de las observaciones hechas por el Presidente, pero no se reuniera el quórum de dos tercios para insistir en el proyecto previamente aprobado por ellas, no habrá ley respecto de los puntos de discrepancias.",
            "Participación ciudadana en la formación de las leyes.",

            "c. Invitación de personas como opinión experta durante la tramitación de un proyecto de ley; y d. Cualquier instancia en que los ciudadanos transmiten su interés en que se legisle sobre una materia en particular.",
            "1.3."

        {
          "id": "c1-4",
          "titulo": "Principios de la actuación judicial",

          "contenido": [
            "Poder Judicial",
            "La función jurisdiccional es aquella en virtud de la cual los órganos competentes del Estado, dotados de independencia e imparcialidad, tienen la facultad de conocer y resolver los conflictos de relevancia jurídica, así como de garantizar y asegurar la legalidad en general, mediante la determinación y aplicación del derecho a casos particulares a través de un debido proceso. Para ello, pueden hacer ejecutar lo juzgado mediante órdenes directas a la fuerza pública o ejercer los medios de acción conducentes de que dispongan.",
            "Los tribunales de justicia se encuentran distribuidos en todo el territorio del Estado y ejercen sus atribuciones y competencias dentro de los límites territoriales que les corresponden según la Constitución Política de la República y las leyes.",
            "La actuación de los tribunales de justicia está informada de los principios de independencia, legalidad, territorialidad, pasividad, inamovilidad, inexcusabilidad, responsabilidad y publicidad. A continuación se describen:",
            "Principio de independencia: Principio esencial del Estado de Derecho que otorga independencia al Poder Judicial respecto de los demás poderes del Estado, para así dar cabal cumplimiento a las funciones que la Constitución y las leyes le encomiendan.",
            "Principio de legalidad: Este principio supone, en primer lugar, que los tribunales deben estar establecidos por ley y, segundo, que los tribunales conocen las causas y fallan conforme a la ley.",
            "Principio de territorialidad: Implica, en cuanto principio, que cada tribunal ejerce sus funciones en un determinado territorio de la República, con excepción de la Corte Suprema que tiene jurisdicción sobre todo el territorio nacional.",
            "Principio de pasividad: Supone que, por regla general, los tribunales actúan a requerimiento de parte, salvo las excepciones legales, como por ejemplo: la oficialidad que exige de los tribunales de familia en casos en que existe vulneración de los derechos de un niño, niña o adolescente.",
            "Principio de inamovilidad: Está relacionado estrechamente con el principio de independencia de las funciones judiciales, ya que pretende resguardar que los tribunales de justicia puedan actuar con libertad e imparcialidad, a través de otorgarle estabilidad a los jueces en su desempeño como tales.",
            "Sin embargo, la inamovilidad de los jueces no es absoluta y la cesación de los jueces en sus funciones tiene lugar: por haber cumplido 75 años de edad; por incapacidad legal sobreviniente;",
            "por renuncia; o por ser depuestos de sus destinos, por causa legalmente sentenciada.",
            "Principio de inexcusabilidad: Este principio establece que los jueces deben resolver siempre los asuntos de su competencia sometidos a su consideración, aun ante ausencia de ley al respecto, debiendo en tal caso aplicar el espíritu general de la legislación y la equidad natural. Al respecto nuestra Carta Fundamental señala que \"reclamada su intervención en forma legal y en negocios de su competencia, no podrán excusarse (los tribunales) de ejercer su autoridad, ni aun por falta de ley que resuelva la contienda o asunto sometidos a su decisión”.",
            "Principio de responsabilidad: La responsabilidad es otro principio básico del Estado de Derecho.",
            "No puede haber ninguna autoridad u órgano del Estado liberado de responsabilidad por los actos que ejecuten dentro de sus funciones. En este sentido, la Constitución Política establece la responsabilidad ministerial de los jueces, haciéndolos responsables de los delitos de: cohecho, falta de observancia de las leyes que reglan el proceso, prevaricación y torcida administración de justicia.",
            "Principio de publicidad: En virtud de este principio, los actos de los tribunales son públicos para terceros, salvo las excepciones expresamente establecidas por la ley, referidas por ejemplo a proteger la presunción de inocencia, datos personales de los litigantes o cuestiones que involucren la seguridad interior del Estado.",
            "Organización y funcionamiento del Poder Judicial",

          "contenido": [
            "a) Corte Suprema",
            "La Excma. Corte Suprema es el más alto tribunal del país, ejerciendo jurisdicción a lo largo de todo el territorio de la República.",
            "Dentro de sus funciones, le corresponde ejercer la superintendencia directiva, correccional y económica de todos los tribunales de la nación, excluyendo el Tribunal Constitucional, el Tribunal Calificador de Elecciones, los tribunales electorales regionales y los tribunales militares en tiempo de guerra.",
            "Además, le corresponde conocer de los recursos procesales (apelación, casación, nulidad, queja, revisión y de unificación de jurisprudencia) entablados contra resoluciones de los tribunales inferiores, debiendo uniformar la interpretación de la ley a través de lo que se denomina jurisprudencia, fuente del derecho que en casos análogos puede ser seguida por los tribunales de inferior jerarquía.",
            "Está compuesta por 21 miembros, cada uno de los cuales recibe el nombre de Ministro, uno de los cuales es su Presidente, elegido por los propios ministros, y dura dos años en sus funciones, no pudiendo ser reelegido.",
            "La Corte Suprema de Justicia funciona dividida en salas especializadas o en pleno, según lo determine la ley para las materias que le corresponda conocer. Corresponderá a la Corte Suprema, mediante auto acordado, establecer cada dos años las materias de que conocerá cada una de las salas en que ésta se divida, tanto en funcionamiento ordinario como extraordinario. Al efecto, especificará la o las salas que conocerán de materias civiles, penales, constitucionales, contencioso administrativas, laborales, de menores, tributarias u otras que el propio tribunal determine.",

          "contenido": [
            "c) Tribunales de primera instancia",
            "En la base del Poder Judicial se encuentran los tribunales de primera instancia, que son, salvo excepciones, los primeros en ser llamados a conocer de los distintos asuntos que se han judicializado. Actualmente, los tribunales de primera instancia están integrados por:",
            "i)",
            "Los Juzgados de Letras en lo Civil, son tribunales cuya función es ejercer jurisdicción sobre una comuna o agrupación de comunas y conocen en única y/o primera instancia, por regla general, de todas las causas en competencia civil sometidas a su conocimiento, de las causas de comercio, de minas, de los juicios no contenciosos y de todas aquellas materias o asuntos que la ley les encomiende. Destacan los juicios ordinarios por incumplimiento de contratos, por indemnización de perjuicios, juicios de arrendamiento, etc.",
            "Su estructura organizacional se compone de un juez, un secretario abogado, y funcionarios profesionales y administrativos, para el cumplimiento eficaz y eficiente de las labores propias del tribunal.",
            "En virtud del artículo 47 del COT, tratándose de juzgados de letras que cuenten con un juez y un secretario, las Cortes de Apelaciones podrán ordenar que los jueces se aboquen de un modo exclusivo a la tramitación de una o más materias determinadas, de competencia de su tribunal, cuando hubiere retardo en el despacho de los asuntos sometidos al conocimiento del tribunal o cuando el mejor servicio judicial así lo exigiere.",
            "ii) Los Juzgados de Garantía, son tribunales cuya finalidad es asegurar los derechos del imputado y demás intervinientes en el proceso penal, así como de conocer y juzgar sobre diversos ilícitos establecidos en la ley penal.",

            "Conocer y fallar las faltas penales de conformidad con el procedimiento contenido en la ley procesal penal;",
            "Conocer y fallar, conforme a los procedimientos regulados en el Título I del Libro IV del Código Procesal Penal, las faltas e infracciones contempladas en la Ley de Alcoholes, cualquiera sea la pena que ella les asigne;",
            "Hacer ejecutar las condenas criminales y las medidas de seguridad, y resolver las solicitudes y reclamos relativas a dicha ejecución, de conformidad a la ley procesal penal, y Conocer y resolver todas las cuestiones y asuntos que le encomiende el Código Orgánico de Tribunales, la ley procesal penal y la ley de responsabilidad penal adolescente.",
            "Los Juzgados de Garantía se conforman por uno o más jueces con competencia en un mismo territorio jurisdiccional, que actúan y resuelven unipersonalmente los asuntos sometidos a su conocimiento. Se encuentran bajo la supervigilancia de las Cortes de Apelaciones.",
            "iii) Tribunales de Juicio Oral en lo Penal, son tribunales colegiados de primera instancia cuya principal función es conocer y juzgar las causas por crimen o simple delito, salvo aquellas cuyo conocimiento y fallo corresponda a un juez de garantía, así como resolver todos los incidentes que se promuevan durante el juicio oral.",

            "v) Los Juzgados de Letras del Trabajo son tribunales competentes para conocer las causas laborales, es decir, aquellas que se suscitan entre trabajadores y empleadores.",

            "vi) Los Juzgados de Cobranza Laboral y Previsional, son tribunales a los cuales compete conocer del cumplimiento de las obligaciones previsionales, de seguridad social y la ejecución de títulos laborales.",

          "fuente": "Págs. 18–26",
          "claves": [
            "los derechos humanos garantizados en el ordenamiento jurídico y reconocidos principalmente en la Constitución Política de la República",

          ],
          "contenido": [
            "DERECHOS HUMANOS Y DERECHOS FUNDAMENTALES",
            "Los derechos humanos son aquellos derechos inherentes a la persona y que le pertenecen en razón a su dignidad, por su naturaleza y condición humana. Son independientes del derecho positivo vigente.",
            "Los derechos fundamentales, por su parte, son los derechos humanos garantizados en el ordenamiento jurídico y reconocidos principalmente en la Constitución Política de la República y en los tratados internacionales ratificados por Chile y que se encuentran vigentes. Son, en consecuencia, los que conforman el bloque constitucional de derechos humanos.",
            "Entre los tratados internacionales de mayor relevancia en el ámbito de los derechos esenciales que emanan de la naturaleza humana cabe mencionar:",
            "● El Pacto Internacional de Derechos Civiles y Políticos;",
            "El Pacto Internacional de Derechos Económicos, Sociales y Culturales; y",
            "La Convención Americana de Derechos Humanos.",
            "El catálogo de derechos fundamentales consagrados en nuestro ordenamiento jurídico suele clasificarse en:",
            "2.1.Derechos Civiles",
            "La Constitución asegura expresamente el derecho a la vida y a la integridad física y psíquica de la persona, protegiendo la vida del que está por nacer, refiriéndose a este respecto a la pena de muerte y a la prohibición de todo apremio ilegítimo. Agrega que el desarrollo científico y tecnológico estará al servicio de las personas y se llevará a cabo con respeto a la vida y a la integridad física y psíquica. En estes entido, señala que la ley regulará los requisitos, condiciones y restricciones para su utilización en las personas, debiendo resguardar especialmente la actividad cerebral, así como la información proveniente de ella.",
            "A continuación, la Constitución consagra el respeto y protección a la vida privada y pública y a la honra de la persona y de su familia. La infracción de este derecho, a través de un medio de comunicación social, puede constituir delito. Esta protección de la vida privada se complementa con el derecho a la inviolabilidad del hogar y de toda forma de comunicación privada, salvo en los casos y formas determinados por la ley.",
            "Se asegura también a toda persona el derecho a la libertad de conciencia, a la manifestación de todas las creencias y el ejercicio libre de todos los cultos que no se opongan a la moral, las buenas costumbres o al orden público. En similar sentido el derecho a la libertad de emitir opinión y la de informar sin censura previa, en cualquier forma y por cualquier medio, sin perjuicio de responder por los delitos y abusos que se cometan en el ejercicio del derecho.",
            "Igualmente, la Carta Fundamental reconoce el derecho a la libertad personal y a la seguridad individual, la libre residencia, circulación y entrada o salida del país, en las condiciones establecidas por la ley, y además una indemnización por error judicial, que cubre los perjuicios patrimoniales y morales que haya sufrido el procesado o condenado por resolución o sentencia injustificadamente errónea o arbitraria, declarada así por resolución de la Corte Suprema de Justicia.",
            "Por su parte, se garantiza a toda persona el derecho a un debido proceso, a defensa y a la irretroactividad de la ley penal, entre otras importantes garantías constitucionales.",
            "En materia laboral, se asegura la libertad de trabajo, el derecho a la libre contratación y a la libre elección del trabajo, prohibiéndose cualquier discriminación que no se base en la capacidad e idoneidad personal. Con todo, en determinadas circunstancias, la ley puede exigir nacionalidad chilena y límites de edad.",
            "En cuanto a la libertad económica, se establece el derecho a desarrollar cualquier actividad económica que no sea contraria a la moral, al orden público o a la seguridad nacional, respetando las normas legales que la regulan.",
            "La Constitución Política reconoce el derecho a la propiedad en sus diversas especies sobre toda clase de bienes corporales o incorporales. Sólo la ley determina el modo de adquirir, usar y gozar de la propiedad y disponer de ella, como asimismo las limitaciones y obligaciones que derivan de su función social. El titular del derecho de propiedad sólo puede ser privado de él o de algunos de sus atributos o facultades esenciales por una ley general o especial que autorice la expropiación por causa de utilidad pública o interés nacional, calificada por el legislador. El expropiado tiene, por cierto, derecho a indemnización por el daño patrimonial efectivamente causado.",
            "La garantía de igualdad",
            "Con relación a las igualdades que forman parte de los derechos civiles y políticos, nuestra Constitución Política asegura las siguientes:",
            "a) La igualdad ante la ley en virtud de la cual ni la ley, ni autoridad alguna pueden establecer diferencias arbitrarias",
            "b) La igual repartición de los tributos en proporción a las rentas o en la progresión o forma que fije la ley, y la igual repartición de las demás cargas públicas.",
            "c) La no discriminación arbitraria en el trato que deben dar el Estado y sus organismos en materia económica y la igual protección de la ley en el ejercicio de sus derechos.",
            "d) La igualdad en la admisión a todas las funciones públicas, sin otros requisitos que los que impongan la Constitución y las leyes.",
            "La garantía de igualdad resulta fundamental en un Estado de Derecho y se expresa, tanto como un principio jurídico que obliga a los poderes públicos a proteger su contenido, como el derecho subjetivo de toda persona de exigir un trato igualitario.",
            "En particular, en materia de igualdad entre hombres y mujeres , desde mediados de los años ’90 se ha incorporado la denominada “perspectiva de género” como un instrumento para promover la igualdad entre mujeres y hombres y eliminar la desigual distribución del poder entre ambos.",
            "Tratándose de personas con discapacidad y de quienes gozan de pensiones de invalidez, diversas leyes, como la Ley N° 20.422, 21.015, 21.275 y 21.690, han significado importantes avances en la garantía efectiva de la igualdad de oportunidades de las personas con discapacidad con el fin de obtener su plena inclusión social, asegurando el disfrute de sus derechos y eliminando cualquier forma de discriminación fundada en la discapacidad. Entre otros elementos, estas disponen cuotas de incorporación, protocolos de actuación y diversas vías para su cumplimiento tanto en el ámbito privado como público.",
            "En el caso de personas extranjeras, cabe considerar que nuestra Constitución les garantiza los mismos derechos que a los chilenos pudiendo votar en las elecciones si tienen permanencia definitiva y viven en Chile por más de 5 años. En materia de educación, el ordenamiento jurídico les garantiza educación gratuita desde la enseñanza preescolar hasta la media, incluso si su condición migratoria es irregular; y en salud, tienen derecho a la atención de urgencia y también en forma privada pagando las prestaciones médicas y hospitalarias y, si son niños o adolescentes, hay atención de salud en los establecimientos de la red pública en igualdad de condiciones que los chilenos.",
            "2.2.Derechos Políticos",
            "Desde esta perspectiva, son ciudadanos los chilenos que hayan cumplido dieciocho años de edad y que no hayan sido condenados a pena aflictiva. Esta calidad de ciudadano otorga los derechos de sufragio, de optar a cargos de elección popular y los demás que la Constitución o la ley confieran.",
            "Además, los ciudadanos tienen derecho a participar en la aprobación o rechazo de reformas constitucionales, bajo los supuestos establecidos en la propia Carta Fundamental.",
            "Finalmente, cabe considerar que los ciudadanos con derecho a sufragio que se encuentren fuera del país pueden sufragar desde el extranjero en las elecciones primarias presidenciales, en las elecciones de Presidente de la República y en los plebiscitos nacionales. Tratándose de extranjeros avecindados en Chile por más de cinco años, que hayan cumplido dieciocho años de edad y que no hayan sido condenados a pena aflictiva, podrán también ejercer el derecho de sufragio.",
            "2.3.Derechos Económicos, Sociales y Culturales",
            "Los derechos económicos, sociales y culturales están contemplados en la Declaración Universal de los Derechos Humanos, cuya protección contempla el Pacto Internacional de Derechos Económicos, Sociales y Culturales. Se consideran como derechos de segunda generación e incluyen, entre otros, el derecho a la alimentación, el derecho a la vivienda, el derecho a la salud, a vivir en un medio ambiente libre de contaminación, a la seguridad social y a la educación.",
            "2.4.Protección de Garantías Constitucionales",
            "Un simple listado de derechos establecidos en el texto de la Constitución, por muy completo que éste sea, no serviría de mucho si no se consignaran los medios idóneos que permitan a las personas recurrir a un órgano jurisdiccional independiente e imparcial cuando los derechos fundamentales sean amenazados, perturbados o conculcados por acto de autoridad o de particulares, para que éste restablezca el imperio del derecho. En razón de lo anterior, es que la propia Constitución Política de la República establece vías como la acción de amparo y de protección, que permite reclamar ante los tribunales de justicia para asegurar el respeto de esas garantías y derechos.",
            "3. EL ESTADO DE DERECHO",
            "Hablamos de Estado de Derecho para referirnos a aquel que se rige por un sistema de leyes e instituciones ordenado en torno a una Constitución, en el que el ordenamiento jurídico organiza y fija los límites de actuación de autoridades, organismos y funcionarios.",
            "Habitualmente se atribuye al Estado de Derecho las siguientes características esenciales:",
            "a) La función jurisdiccional está radicada en tribunales de justicia a los que les corresponde conocer de las causas civiles y criminales, resolverlas y hacer ejecutar lo juzgado para un caso determinado.",
            "b) El ordenamiento jurídico es expresión auténtica de la nación, manifestada a través del órgano constituyente o legislativo elegido libremente, en elecciones donde la ciudadanía se pronuncia de manera informada, libre y sin temor a represalias.",
            "c) El poder Estatal se distribuye en órganos diferenciados que desarrollan su tarea con suficiente autoridad e independencia. Ello implica la existencia de órganos ejecutivos, legislativos, judiciales, de control, entre otros, que desarrollan sus funciones específicas y que pueden evitar que los otros abusen del poder o realicen actos arbitrarios.",
            "d) Los órganos del Estado sólo pueden actuar válidamente previa investidura regular de sus integrantes, dentro de su competencia y en la forma que prescribe la ley. En consecuencia, toda autoridad es responsable por los actos contrarios al ordenamiento jurídico generándose responsabilidad penal, civil, administrativa y/o política.",
            "e) El ordenamiento jurídico reconoce, ampara y promueve los derechos humanos, estableciendo mecanismos o medios jurídicos eficaces.",
            "3.1. El Ciudadano y sus Derechos.",
            "Los derechos de los ciudadanos en general y, particularmente frente a los órganos de la Administración del Estado y de la Administración de Justicia, pueden ser ejercidos de manera efectiva en la medida que la normativa perfila nuevas y mejores herramientas para su protección y también en la medida que la ciudadanía se va informando acerca de los mismos.",
            "El ciudadano, bajo tales condiciones, descubre que puede ubicarse desde distintas perspectivas o posiciones en su relación con el Estado y con la sociedad en general, como usuario de servicios, beneficiario de políticas públicas, cliente, solicitante de información pública, funcionario o defensor de sus datos personales, entre otros.",
            "El ciudadano y el Poder Judicial.",
            "Sin perjuicio de los recursos administrativos, es posible sostener que los tribunales de justicia son el espacio esencial al que los ciudadanos pueden recurrir en busca de la protección, restablecimiento o reparación de sus derechos cada vez que éstos son amenazados o vulnerados, sin embargo hay que considerar también que, en su calidad de ciudadanos, les asisten derechos y tienen deberes en relación al trato en cuanto usuarios del sistema judicial.",
            "Dentro de los principales derechos que podemos mencionar, está el de recibir información general y actualizada sobre el funcionamiento del Poder Judicial y sobre las características y requisitos genéricos de los distintos procedimientos judiciales y administrativos en que deba o pueda participar; a conocer el horario de atención al público, el que deberá encontrarse en un lugar visible y accesible; a obtener información clara, completa, veraz y actualizada sobre el estado de su trámite; a acceder a los documentos, libros, archivos y registros judiciales que no tengan carácter reservado; a ser informada con un lenguaje sencillo y preciso; entre otros.",
            "El ciudadano tiene también derecho a ser atendido con dignidad, respeto e igualdad por las autoridades y funcionarios del Poder Judicial, sin distinción de raza, género, religión, opinión política, nacionalidad, origen social, posición económica, nacimiento o cualquier otra condición; a exigir reserva de la información que proporcione a los funcionarios y autoridades y que pertenezca a su esfera privada, salvo aquella que por ley deba ser puesta a disposición de las partes o de terceros.",
            "Adicionalmente, tiene derecho a conocer la identidad y categoría de la autoridad o funcionario que le atienda; a recibir respuesta oportuna a las peticiones que formule respetuosamente; a que las presentaciones judiciales sean proveídas y las resoluciones judiciales sean dictadas en un plazo razonable y a exigir que las actuaciones judiciales o en las que se solicite su comparecencia se celebren con puntualidad.",
            "También tiene derecho a expresar su opinión sobre la calidad de la atención brindada y a formular consultas, reclamos, felicitaciones o sugerencias relativas al funcionamiento y a la calidad de la atención recibida, y a ser informado respecto del procedimiento a seguir ante dichas consultas, reclamos, felicitaciones o sugerencias.",
            "En materia de costos, el ciudadano tiene derecho a incurrir en los menores costos económicos posibles; a que su comparecencia personal ante los órganos y tribunales que integran el Poder Judicial sea lo menos gravosa posible; y a disponer gratuitamente de los formularios que se necesiten para el ejercicio de sus derechos ante los tribunales cuando no se ordene obligatoriamente la intervención de abogado u otro profesional.",
            "En relación a situaciones particulares, cabe agregar que la Ley de Juzgados de Familia establece que el niño, niña o adolescente tiene derecho a ser oído en todo proceso judicial en que esté directamente implicado y a que se guarde la reserva necesaria para preservar su intimidad y el derecho a su propia imagen.",
            "Por su parte, tratándose de los ciudadanos con discapacidad sensorial, física o psíquica, se debe considerar especialmente que ellos pueden ejercer sus derechos y que, en casos expresamente establecidos en la ley, tienen derecho a la utilización de un intérprete de signos o de medios tecnológicos para comunicarse.",
            "Finalmente, en Chile los extranjeros tienen derecho a acceder a la justicia en igualdad de condiciones que los nacionales y, en consecuencia, deben ser atendidos sin sufrir discriminación alguna por razón de su raza, lengua, religión o creencias.",
            "En materia de deberes, es útil recordar que el ciudadano que recurre al Poder Judicial tiene el deber de respetar a los funcionarios y autoridades que le atienden, respetar los procedimientos y horarios dispuestos para su atención y no dañar los bienes y dependencias que se ponen a disposición del público.",
            "El ciudadano y el acceso a información pública.",
            "La Ley N° 20.285, de Transparencia de la función pública, establece el derecho de acceso a la información y los procedimientos para su ejercicio y amparo.",
            "La referida ley distingue al efecto entre transparencia activa y pasiva.",
            "La primera, consiste en la obligación que tienen los ministerios, las intendencias, las gobernaciones, los gobiernos regionales, las municipalidades, las Fuerzas Armadas, los servicios públicos, las empresas del Estado, la Contraloría General de la República, el Banco Central, el Congreso Nacional, los Tribunales que forman parte del Poder Judicial, el Ministerio Público, el Tribunal Constitucional y la Justicia Electoral, de mantener información actualizada en sus respectivas páginas web.",
            "Si el órgano obligado a mantener la información referida en su página web incumple con esta obligación, cualquier ciudadano puede denunciar al Consejo para la Transparencia y a la Contraloría General de la República.",
            "El Consejo para la Transparencia es un servicio público autónomo que tiene por funciones principales promover la transparencia de la función pública, fiscalizar el cumplimiento de las normas de transparencia y garantizar el derecho de acceso a la información.",
            "En relación a la transparencia denominada “pasiva”, podemos señalar que es el derecho que tienen los ciudadanos para solicitar información de cualquier órgano de la Administración del Estado presencialmente en el servicio al cual se requiere el acceso a la información, o bien a través de su respectiva página web, completando el formulario diseñado especialmente para estos fines.",
            "En su solicitud de acceso a la información pública, el ciudadano deberá indicar: nombre, apellidos y dirección del solicitante, una identificación clara de la información que requiere, el órgano al que se dirige y su firma. Esta solicitud es gratuita y el organismo requerido sólo puede exigir el pago de los costos directos de reproducción de los antecedentes que se solicitan.",
            "Una vez hecha la solicitud, el requerido tiene un plazo máximo de 20 días hábiles para dar respuesta, plazo que se puede extender excepcionalmente por otros 10 días hábiles, lo que le deber ser comunicado al solicitante.",
            "En caso de que la información solicitada no sea entregada dentro de plazo o sea denegada por causa que no se estime por el ciudadano como de secreto o reserva, éste puede presentar una acción de reclamo –o amparo- ante el Consejo para la Transparencia, dentro del plazo de 15 días hábiles. Recibido el amparo, el Consejo para la Transparencia pide informe al organismo reclamado el cual tiene 10 días hábiles para formular sus observaciones y/o descargos. Evacuado el informe o transcurrido el plazo, el Consejo para la Transparencia resuelve el amparo. Si decide que debe entregarse la información, fijará un plazo prudente para su entrega.",
            "En contra de la resolución del Consejo para la Transparencia procede recurso de ilegalidad ante la Corte de Apelaciones respectiva, dentro del plazo de 15 días corridos. La interposición de este recurso suspende los efectos de la resolución recurrida que da lugar al acceso a la información.",
            "Finalmente, cabe considerar que el jefe de servicio del organismo –su Subsecretario o Directorque niegue infundadamente el acceso a la información, puede ser sancionado con una multa de 20% a 50% de su remuneración. Si la autoridad persiste en su actitud, se le doblará la sanción pudiendo ser suspendido del cargo por cinco días.",
            "3.2. Transparencia, privacidad, protección de datos y Poder Judicial",
            "Tal como se señaló en el apartado precedente, la Ley N° 20.285, de Transparencia de la función pública, sólo establece obligaciones para el Poder Judicial en relación a transparencia activa, pero no así para los requerimientos y solicitudes de acceso a la información que formulen los ciudadanos: transparencia pasiva. Sin embargo, desde el mes de diciembre de 2013 el Poder Judicial se sumó, de manera voluntaria, al Portal de Transparencia del Estado que integran también otras instituciones, como la Contraloría General de la República y la Cámara de Diputados.",
            "En consecuencia, el Poder Judicial asumió desde ese momento un compromiso institucional expreso de entregar información a la ciudadanía en forma transparente, sin más límite que las exigencias legales que establecen la reserva o el secreto de asuntos específicos.",
            "Adicionalmente, hay que destacar que el Poder Judicial cuenta, desde el año 2008, con una Comisión de Transparencia, encargada de velar, promover e impulsar iniciativas que contribuyan al fortalecimiento de la transparencia como un valor institucional, así como también conocer y resolver las peticiones que en esta materia realice la ciudadanía, haciendo efectivo el cumplimiento de las normas relativas a la materia establecidas tanto en la referida Ley N° 20.285, como en la Constitución Política de la República, el Código Orgánico de Tribunales y en los acuerdos adoptados por el tribunal pleno.",
            "En este contexto, se exige a los miembros del Poder Judicial, en garantía de los principios de probidad y transparencia, presentar declaraciones juradas de intereses, de patrimonio y de no ser dependiente de sustancias o drogas estupefacientes o sicotrópicas ilegales.",
            "Dentro de las obligaciones que impone la Ley 20.285 al Poder Judicial, hay que considerar la establecida en el artículo octavo transitorio, que impone a la Corporación Administrativa del Poder Judicial el deber de mantener a disposición permanente del público en sus sitios electrónicos, y debidamente actualizados, los antecedentes indicados en el artículo 7° de la Ley de Transparencia de la Función Pública y Acceso a la Información de la Administración del Estado.",
            "En materia de transparencia activa el Poder Judicial, junto con cumplir la obligación de mantener información permanentemente actualizada en su página web, publica información adicional, tal como la votación de los candidatos a ministros de la Corte Suprema y la publicación de sus antecedentes en el sitio web, los concursos públicos para la selección de abogados integrantes, las declaraciones de patrimonio, intereses y currículos de todos los ministros de la Corte Suprema y ministros de las Cortes de Apelaciones del país.",
            "En relación a la publicación de sentencias y carpetas judiciales, así como al respeto a los principios de transparencia, así como la protección del derecho a la privacidad y de datos personales, es necesario referirse al Auto Acordado 164-2024 de la Corte Suprema, el que establece la regulación vigente en materia de acceso a las carpetas electrónicas judiciales y el buscador de jurisprudencia del Poder Judicial. Su regulación tiene por objeto actualizar y simplificar la regulación sobre el acceso a las carpetas electrónicas judiciales y el buscador de jurisprudencia del Poder Judicial, equilibrando la necesidad de transparencia y publicidad de los procesos judiciales con la imperiosa necesidad de proteger los datos personales y sensibles de los involucrados. De esta manera, establece la obligación de publicar y mantener disponibles carpetas y sentencias judiciales, a la vez de que regula limitaciones y establece medidas precisas para la anonimización de sentencias en casos donde la ley o el tribunal ordenen reserva para proteger datos personales y sensibles.",
            "3.3. Ética Judicial",
            "La ética judicial está relacionada estrechamente con el principio de independencia judicial. Implica el deber de todo juez de adoptar las normas más elevadas posibles de conducta personal y profesional.",
            "La ética judicial se inspira en los siguientes principios:",
            "Dignidad: Exige a todo miembro del Poder Judicial ejercer su cargo con dignidad, absteniéndose de toda conducta contraria a la seriedad y decoro que el cargo exige. Este principio debe expresarse especialmente en las audiencias, en relación a las exigencias que requiere la dignidad de la magistratura en el vestuario, trato con abogados y otros partícipes en los procedimientos, así como con los subordinados y público en general, evitando toda actitud o comportamiento que menoscabe tal condición.",
            "Probidad: Consiste en el deber de actuar con rectitud y honestidad, procurando prestar servicio satisfaciendo el interés general de la Justicia y desechando todo provecho o ventaja personal que pueda lograr por sí o a través de otras personas.",
            "Esta obligación exige abstenerse de mostrar interés por asuntos de que conozca o pueda conocer un tribunal, interceder o intervenir en cualquier forma a favor o en contra de persona alguna, cualquiera que sea la naturaleza del juicio o gestión de que se trate. Ella comprende también los concursos, nombramientos, calificaciones, traslados y demás materias relativas al personal del Poder Judicial.",
            "Integridad: Implica una conducta recta e intachable, de modo de promover la confianza de la comunidad en la Justicia. En consecuencia, con su comportamiento procurará no dar lugar a críticas ni reclamos de parte de quienes recurren a los tribunales ni de otras autoridades o del público, en general.",
            "Independencia: Tanto los jueces, como los demás funcionarios judiciales, deben en conjunto e individualmente, velar por la autonomía de los tribunales y hacerla respetar en toda circunstancia.",
            "Prudencia: Todo miembro del Poder Judicial debe actuar con diligencia, tino y criterio en todas las materias en que le corresponda intervenir en razón o con ocasión de sus funciones, procurando que la forma como las ejercen inspire confianza a la comunidad.",
            "Dedicación: Los jueces y demás funcionarios judiciales deberán tener una disposición permanente a desempeñar sus cargos con acuciosidad, conocimiento y eficiencia, actuando con equidad y diligencia en todas las funciones que deban cumplir.",
            "Sobriedad: Los jueces y otros funcionarios del Poder Judicial deben demostrar templanza y austeridad tanto en el ejercicio de sus cargos como en su vida social, evitando toda ostentación que pueda plantear dudas sobre su honestidad y corrección personales.",
            "Respeto: Los jueces y demás funcionarios judiciales deberán demostrar respeto por la dignidad de todas las personas en las audiencias y demás actuaciones que lleven a cabo con motivo del desempeño de sus cargos.",
            "Reserva: Los jueces y demás funcionarios judiciales deben mantener absoluta reserva sobre todos los asuntos que así lo exijan y de los que tomen conocimiento, absteniéndose de darlos a conocer, emitir opiniones en público o privadas a su respecto, permitir que sean conocidos por otras personas ni utilizar la información que posean en razón de sus funciones en beneficio propio o ajeno.",
            "Los Ministros, Jueces y demás funcionarios judiciales deberán abstenerse de conceder entrevistas, formular declaraciones, aceptar y contestar interrogatorios e incurrir de cualquier modo en publicidad, en diarios, revistas, televisión o cualquier medio de comunicación social sobre las causas sometidas a su conocimiento o de otro Tribunal, bajo apercibimiento de aplicación de las medidas disciplinarias que procedan.",
            "Prohibición de Recibir Estímulos Pecuniarios: Se prohíbe a los jueces y demás funcionarios judiciales la recepción de estímulos de carácter pecuniario que excedan lo simbólico por el ejercicio de sus labores, pues ello, aparte de crear un ambiente público desfavorable a la función judicial en general, afecta seriamente la independencia e imparcialidad de esos funcionarios.",
            "Inhabilidades",

            "TRAMITACIÓN DIGITAL Y COMPARECENCIA REMOTA",

            "Por otro lado, a partir de las restricciones sanitarias provocadas por la pandemia del COVID-19 y las consecuencias que estas tuvieron para la administración de justicia, diversas normativas buscaron regular el uso de herramientas tecnológicas que permitiesen la comparecencia remota a través de sistemas de videoconferencias. De particular relevancia en este punto es la Ley Nº 21.394 que, entre otras modificaciones transitorias y permanentes estableció el marco jurídico vigente en la materia.",

            "Se fundamenta en los siguientes principios:",

            "Principio de fidelidad: Todas las actuaciones del proceso se registrarán y conservarán íntegramente y en orden sucesivo en la carpeta electrónica, la que garantizará su fidelidad, preservación y la reproducción de su contenido.",
            "Principio de publicidad: Los actos de los tribunales son públicos y, en consecuencia, los sistemas informáticos que se utilicen para el registro de los procedimientos judiciales deberán garantizar el pleno acceso de todas las personas a la carpeta electrónica en condiciones de igualdad, salvo las excepciones establecidas por la ley.",

            "En casos excepcionales, cuando las circunstancias así lo requieran o se trate de una persona autorizada por el tribunal por carecer de los medios tecnológicos necesarios, los escritos podrán presentarse al tribunal materialmente y en soporte papel por conducto del ministro de fe respectivo o del buzón especialmente habilitado al efecto. Los escritos presentados en formato papel serán digitalizados e ingresados a la carpeta electrónica inmediatamente.",
            "Los documentos electrónicos se presentarán a través del sistema de tramitación electrónica del Poder Judicial o, en caso de requerirlo así las circunstancias, se acompañarán en el tribunal a través de la entrega de algún dispositivo de almacenamiento de datos electrónicos.",
            "Los documentos cuyo formato original no sea electrónico se presentarán de forma electrónica, salvo que la parte contraria formule objeción. En este caso, los documentos deberán presentarse materialmente en el tribunal y quedarán bajo la custodia del funcionario o ministro de fe correspondiente. De la misma manera deben presentarse en todo caso los títulos ejecutivos cuyo formato original no sea electrónico. Sin perjuicio de ello, si el documento es presentado materialmente, deberá acompañarse con una copia en formato digital salvo cuando se haya autorizado a una persona para presentar escritos materialmente por carecer de los medios tecnológicos, en cuyo caso serán digitalizados e ingresados a la carpeta electrónica por el tribunal.",

            "De la conciliación total o parcial se levantará acta, que consignará sólo las especificaciones del arreglo. La suscribirán el juez, las partes que lo deseen y el secretario, y se estimará como sentencia ejecutoriada para todos los efectos legales.",
            "1.3. Período de prueba",

            "a) Entorpecimiento que imposibilita la recepción de la prueba durante el probatorio, sea absoluto o en un lugar determinado. Se debe reclamar del obstáculo en el momento de presentarse o dentro de los 3 días siguientes. El término especial durará el número de días que dure el entorpecimiento.",
            "b) Término especial para rendir prueba de testigos iniciada oportunamente, y no concluidas en él por impedimento cuya remoción no haya dependido de la parte interesada.",
            "c) Término especial por inasistencia del juez de la causa.",
            "1.3.2. Los medios de prueba",

            "Dentro de esta categoría de medio probatorio suele incorporarse no solo la representación escrita del pensamiento, sino también otro tipo de cosas u objetos que pueden tener contenido representativo, con independencia de su modo de almacenamiento. Así, dentro de esta categoría caben no solo materiales escritos sino también fotografías, videos, etc. Instrumento, en este sentido, es una especie dentro del género de documentos, que da cuenta de un hecho.",
            "Luego, la regulación del procedimiento civil distingue fundamentalmente entre instrumentos públicos y privados. Instrumento público es el autorizado con las solemnidades legales por el competente funcionario, y el instrumento privado en cambio, es aquel que no cumple con tales requisitos.",

            "Instrumento público",

            "El instrumento público hace plena fe entre las partes del hecho de haberse otorgado, y no sólo de ello, sino que al hecho de haberse otorgado realmente por las personas y de la manera que en el instrumento se expresa. Además, hace plena prueba entre las partes sobre su fecha.",
            "Respecto de terceros tiene pleno valor probatorio en cuanto al hecho de haberse otorgado y en cuanto a su fecha, al igual que entre las partes. En cuanto a su contenido hace plena fe, tanto entre las partes como frente a terceros.",

            "1.3.2.2. Testigos",

            "1.3.2.3. Absolución de posiciones",

            "1.5. Término del juicio ordinario en primera instancia",

            "● Conciliación: es un método autocompositivo de resolución de controversias que consiste en un acuerdo que es alcanzado por las partes mediante la proposición de bases de arreglo que hace el juez de la causa.",

            "1.5.2. Recursos procesales",

            "Procede en contra de sentencias definitivas e interlocutorias cuando ponen término al juicio o hacen imposible su continuación y, excepcionalmente, contra sentencias interlocutorias que no pongan término al juicio o hagan imposible su continuación, siempre que: (i) se hubieren dictado en segunda instancia y, (ii) se hubieren dictado sin previo emplazamiento de la parte agraviada o sin señalar día para la vista de la causa. También procede en contra de sentencias que se dicten en los juicios o reclamaciones regidos por leyes especiales, con excepción de aquellos que se refieran a la constitución de las juntas electorales y a las reclamaciones de los avalúos de la Ley sobre impuesto territorial y de las demás que prescriban las leyes.",
