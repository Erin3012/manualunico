          "contenido": [
            "PROCEDIMIENTO EJECUTIVO",
            "Es un procedimiento contencioso, por el cual se persigue el cumplimiento forzado de una obligación que consta de un título ejecutivo, al cual la ley le da el carácter de fehaciente e indubitado.",
            "Este juicio mantiene dos procedimientos paralelos y simultáneos: uno el ejecutivo mismo, donde se discuten las excepciones al cumplimiento de la obligación; y el otro el llamado de apremio, donde se tramita el embargo y de la realización de los bienes del deudor.",
            "Hay 3 clases de Juicio Ejecutivo:",
            "a. Juicio Ejecutivo de Obligación de Dar: Título I Libro III CPC (artículos 434 al 529).",
            "b. Juicio Ejecutivo de Obligación de Hacer: Título II Libro III CPC (artículos 530 al 544).",
            "c. Juicio Ejecutivo de Obligación de No Hacer: Título II Libro III CPC (artículos 530 al 544).",
            "2.1. Presupuestos de la ejecución forzada",
            "Para obtener el cumplimiento forzado de la obligación en juicio ejecutivo, es necesario que se cumplan los siguientes presupuestos:",
            "a. Que la obligación cuyo cumplimiento se busca, conste en un título al que la ley le atribuya el carácter o mérito ejecutivo (Art. 434, 530 y 544 CPC).",
            "b. Que la obligación sea actualmente exigible (Art. 437, 53 y 544 CPC).",
            "c. Que la obligación sea líquida, tratándose de obligaciones de dar, determinada, en el caso de obligaciones de hacer, y susceptible de convertirse en una obligación de destruir la obra hecha en el caso de las obligaciones de no hacer (Art. 438, 530 y 544 CPC).",
            "d. Que la acción ejecutiva no se encuentre prescrita (Art. 442, 531 y 544 CPC).",
            "2.1.1. Título ejecutivo",
            "Un título ejecutivo es un documento al cual la ley le atribuye la suficiencia necesaria para exigir el cumplimiento forzado de una obligación que consta en él. Sólo la ley puede crear títulos ejecutivos y éstos están taxativamente enumerados en el art. 434 del CPC y en leyes especiales.",
            "De esta manera, establece el art. 434 del CPC que son títulos ejecutivos los siguientes:",
            "Nº 1. Sentencia firme, bien sea definitiva o interlocutoria",
            "Para que la sentencia tenga mérito ejecutivo, es necesario que esté firme, y se entiende que se encuentra en este estado cuando no procede recurso alguno en contra de ella, o procediendo éstos se han resuelto, o no se han hecho valer dentro del plazo legal. Es necesario que esta sentencia contenga una obligación de dar, hacer o no hacer.",
            "Nº 2.Copia autorizada de escritura pública.",
            "Son aquellas copias autorizadas por un Notario Público o un Archivero Judicial.",
            "Nº 3. Acta de avenimiento pasada ante el tribunal competente y autorizada por un ministro de fe o por dos testigos de actuación.",
            "N°4. Instrumento privado reconocido judicialmente o mandado tener por reconocido.",
            "El instrumento privado adquiere mérito ejecutivo cuando ha sido reconocido judicialmente o cuando ha sido mandado tener por reconocido. Sin embargo la letra de cambio, el pagaré o el cheque cuya firma aparezca autorizada por un Notario o por el Oficial del Registro Civil -en las comunas donde no tenga su asiento un Notario- tendrá mérito ejecutivo sin necesidad de reconocimiento previo.",
            "El reconocimiento se consigue a través de gestiones previas que se denominan \"diligencias preparatorias de la vía ejecutiva\".",
            "Nº 5: Confesión judicial.",
            "Nº 6: Cualesquiera títulos al portador o nominativos, legítimamente emitidos, que representen obligaciones vencidas, y los cupones también vencidos de dichos títulos, siempre que los cupones confronten con los títulos, y estos, en todo caso, con los libros talonarios.",
            "Nº 7: Cualquiera otro título a que las leyes den fuerza ejecutiva.",
            "Por ejemplo, la cuarta copia de la factura, los acuerdos de la junta ordinaria de comuneros de una comunidad de aguas sobre gastos y fijación de cuotas, el certificado de deuda de gastos comunes autorizada por el administrador, etc.",
            "2.1.2. Obligación actualmente exigible",
            "Es decir, la obligación cuyo cobro se pretende, no debe hallarse sujeta a ninguna modalidad (condición, plazo o modo) y de estarlo, deberá acreditarse fehacientemente que la modalidad se ha cumplido a favor del acreedor.",
            "2.1.3. Obligación líquida, determinada o convertible",
            "Este requisito difiere según el tipo de obligación de que se trate. Si la obligación es de dar, la deuda debe ser líquida, lo que significa que su objeto se halla perfectamente determinado, sea en su especie o en su género y cantidad. Por otro lado, si la obligación es de hacer, la deuda debe ser determinada, es decir, se debe poder conocer exactamente en qué consiste la prestación del deudor, sin margen a segundas interpretaciones. Finalmente, si la obligación es de no hacer, debe poder convertirse en la destrucción de la obra hecha, con lo cual la obligación se transforma en una de hacer.",
            "2.1.4. Acción ejecutiva no prescrita",
            "La regla general es que el título ejecutivo prescribe en 3 años contados desde que la obligación contenida en él se hizo exigible (art. 2514 y 2515 Código Civil).",
            "Sin embargo, otra particularidad es que la acción ejecutiva prescrita subsiste por otros 2 años más como ordinaria. En efecto, si ya ha transcurrido el plazo de 3 años para deducir la acción ejecutiva, de igual manera puede perseguirse el cumplimiento de la obligación por los dos años que restan para completar los 5 años de la acción ordinaria de prescripción, pero ya no directamente mediante el juicio ejecutivo, en tanto el tribunal deberá denegar la ejecución.",
            "Ahora bien, hay obligaciones cuya acción ejecutiva tiene plazos de prescripción especiales:",
            "a. Cuando el título es un cheque protestado: La acción ejecutiva prescribe dentro de 1 año contado desde la fecha del protesto (artículo 34 Ley de Cuentas Corrientes Bancarias y de Cheques).",
            "b. Letra de cambio y pagaré: El plazo de prescripción es también de 1 año contado desde que la obligación se hizo exigible (artículo 98 Ley N° 18.092).",
            "c. La cuarta copia de la factura también prescribe en un año contado desde el vencimiento (art. 10 Ley N° 19.983).",
            "2.2. Gestión preparatoria de la vía ejecutiva",
            "Son procedimientos judiciales previos que puede realizar el acreedor en contra del deudor, destinados a perfeccionar o completar el título con el cual se pretende iniciar una ejecución.",
            "De esta manera, si el acreedor tiene un documento que da cuenta de una obligación líquida, determinada o determinable, actualmente exigible y no prescrita, la que no consta en un título ejecutivo, puede preparar su entrada en juicio ejecutivo por medio de las denominadas gestiones preparatorias de la vía ejecutiva, como el reconocimiento de firma puesta en instrumento privado;",
            "la notificación judicial de protesto de letra, pagaré o cheque, o confesión judicial o confesión de deuda. Para ello, podrá pedir que se cite al deudor a una audiencia dentro de quinto día contado desde la fecha de la última notificación.",
            "2.3. Etapas en el juicio ejecutivo",
            "La tramitación del juicio ejecutivo se lleva en dos cuadernos: El cuaderno principal y el de apremio, que se conservan juntos en la causa y que se tramitan en paralelo.",
            "En el cuaderno principal consta la demanda y las excepciones a su ejecución opuestas por el deudor. El cuaderno de apremio, en tanto, contiene todas las gestiones destinadas a obtener la realización de los bienes.",
            "2.3.1. El cuaderno principal",
            "El cuaderno principal o ejecutivo es aquél que contiene la contienda jurídica que las partes someten al conocimiento del juez para su resolución conforme a derecho. Se compone de las siguientes actuaciones:",
            "Demanda ejecutiva",
            "Excepciones del deudor",
            "Sentencia definitiva",
            "Trámites posteriores a la prueba",
            "Contestación de las excepciones",
            "Admisibilidad o inadmisibilidad de las excepciones",
            "Término probatorio",
            "Recepción de la causa a prueba",
            "La demanda ejecutiva",
            "La demanda ejecutiva, que puede ser la primera gestión en el juicio ejecutivo o puede ir precedida de una gestión preparatoria de la vía ejecutiva, es el medio por el cual el actor ejerce su pretensión y funda su título ejecutivo. Ésta debe cumplir con los requisitos generales de todo escrito y los específicos del art. 254 CPC, dentro de las cuales es fundamental que contenga la enunciación precisa y clara de las peticiones que se someten al fallo del tribunal, la más importante de las cuales debe ser la petición de requerir de pago al deudor despachándose el mandamiento de ejecución y embargo contra él, y que en definitiva se acoja la demanda siguiendo adelante con la ejecución hasta el completo pago del crédito. Hay otros que además señalan bienes para la traba de embargo, designan depositario de los bienes embargados, solicitan la custodia del título ejecutivo en que funda la ejecución.",
            "Presentada la demanda a tramitación, el juez tiene el deber de examinar el título y conceder o denegar la ejecución, tras analizar el cumplimiento de los requisitos propios de la acción ejecutiva.",
            "Si se ha verificado como admisible la demanda, el tribunal deberá declararlo en la resolución y mandará a notificar la demanda al deudor y ordenará en el mismo escrito: “despáchese mandamiento de ejecución y embargo”. Si se deniega la ejecución, el ejecutante podrá apelar o si, fuera procedente, recurrir de casación en la forma o en el fondo.",
            "Se lo notificará de la demanda personalmente o por cédula (cuaderno principal), y en el mismo acto, se le requerirá de pago (en el cuaderno de apremio). Si al momento de requerirse de pago el deudor no se encuentra, se le dejará un aviso para presentarse el día, hora y lugar que fije el ministro de fe para practicar el requerimiento. No concurriendo a esta citación el deudor, se le tendrá por requerido de pago, y se hará inmediatamente y sin más trámite el embargo.",
            "Excepciones",
            "Una vez requerido de pago, el deudor puede defenderse mediante la oposición de excepciones.",
            "Los plazos para ello dependen del lugar en que sea requerido de pago.",
            "Si el deudor es requerido de pago en el territorio jurisdiccional del tribunal en que se interpuso la demanda, tendrá el término de ocho días útiles para oponerse a la ejecución.",
            "Si el requerimiento se hace en territorio jurisdiccional de otro tribunal de la república, la oposición podrá presentarse ante el tribunal que haya ordenado cumplir el exhorto del que conoce en el juicio o ante este último tribunal. En el primer caso, los plazos serán los mismos, es decir, ocho días. En el segundo, el ejecutado deberá formular su oposición en el plazo fatal de ocho días, más el aumento del término en conformidad a la tabla de emplazamiento. Si se verifica el requerimiento fuera del territorio de la República, el término para deducir oposición será el que corresponda según la tabla de emplazamiento, como aumento extraordinario del plazo para contestar una demanda.",
            "Todos estos plazos son fatales y se cuentan desde el día del requerimiento de pago.",
            "Luego, la oposición del ejecutado sólo podrá fundarse en alguna de aquellas contenidas en el listado que señala el art. 464 del Código de Procedimiento Civil, por ejemplo a la incompetencia del tribunal ante quien se haya presentado la demanda; la ineptitud de libelo por falta de algún requisito legal en el modo de formular la demanda; la falsedad del título; el pago de la deuda; la concesión de prórroga del plazo; la compensación; la transacción; entre otras, no pudiendo extenderse a alguna no contenida en dicho listado.",
            "Contestación de las excepciones",
            "Del escrito presentado por el ejecutado con sus excepciones, se comunicará al ejecutante para que dentro de cuatro días exponga lo que juzgue oportuno. En esta contestación, el demandante ejecutivo puede argumentar por qué estima que las excepciones presentadas deberían rechazarse. Por otra parte, solo dentro de este mismo plazo, podría desistirse de la demanda ejecutiva con reserva de su derecho para entablar acción ordinaria sobre los mismos puntos que han sido materia de aquélla.",
            "Declaración de admisibilidad o inadmisibilidad de las excepciones",
            "Vencido el plazo para la contestación de la oposición, haya o no hecho observaciones el demandante, se pronunciará el tribunal sobre la admisibilidad o inadmisibilidad de las excepciones alegadas.",
            "En este trámite de control formal, el tribunal comprueba si las excepciones se han opuesto en la forma que corresponde, y no importa necesariamente un control de mérito, lo que se efectúa en la sentencia definitiva.",
            "Si las estima inadmisibles, o si no considera necesario que se rinda prueba para resolver, dictará desde luego sentencia definitiva. En caso contrario, recibirá a prueba la causa.",
            "Recepción de la causa a prueba y término probatorio",
            "Si el tribunal decreta que las excepciones del ejecutado son admisibles y estima necesario que se rinda prueba, debe dictar una resolución ordenando recibir la causa a prueba y estableciendo cuáles serán los hechos sustanciales, pertinentes y controvertidos sobre los cuales deberá recaer.",
            "La resolución que recibe la causa a prueba debe notificarse por cédula a las partes. El término probatorio de las excepciones será de 10 días. El término probatorio podrá ampliarse por 10 días más a solicitud del acreedor formulada antes de su vencimiento, y en todo caso, las partes de común acuerdo podrán concederse términos probatorios extraordinarios.",
            "La prueba se rinde y tramita de la misma manera que en el juicio ordinario.",
            "Trámites posteriores a la prueba",
            "Vencido el término probatorio, las partes tendrán 6 días para hacer observaciones a la prueba, luego de lo cual, el tribunal citará a las partes a oír sentencia. Al igual que en el juicio ordinario, se trata de un trámite esencial que produce los mismos efectos de cerrar el debate.",
            "De igual manera, a falta de norma especial y en aplicación a las normas comunes a todo procedimiento, es posible que dentro del plazo para dictar sentencia en el juicio ejecutivo, el tribunal decrete medidas para mejor resolver, de acuerdo a lo señalado en el juicio ordinario.",
            "Sentencia",
            "El tribunal tendrá 10 días para dictar sentencia contados desde que el pleito quedó concluso. La sentencia se limitará a declarar si acoge o rechaza las excepciones. Si acoge una excepción, puede omitir referirse a las demás.",
            "La sentencia puede ser absolutoria o condenatoria para el ejecutado. Si es condenatoria, puede ser condenatoria de pago o condenatoria de remate. En el primer caso, obligará al deudor a entregar una suma líquida de dinero o el bien que se adeuda. En el segundo, el juez ordenará el embargo de bienes suficientes del deudor, los que serán rematados para pagar con su producido al acreedor.",
            "Finalmente, si el deudor no dedujo excepciones, se omitirá el fallo y bastará el mandamiento de ejecución y embargo para que el acreedor pueda perseguir los bienes del deudor y el pago de su deuda conforme a las normas de apremio.",
            "La sentencia recaída en el juicio ejecutivo produce cosa juzgada en el juicio ordinario tanto respecto del ejecutante como del ejecutado.",
            "Contra la sentencia definitiva caben los recursos de aclaración, rectificación, apelación, casación y revisión.",
            "2.3.2. El cuaderno de apremio",
            "En este cuaderno se contienen todas las gestiones que se realizan para el pago compulsivo de la deuda. En particular, las actuaciones que conforman este cuaderno son:",
            "Mandamiento de ejecución y embargo",
            "Requerimiento de pago",
            "Pago al acreedor",
            "Liquidación del crédito y de las costas",
            "Embargo",
            "Consignación del valor de los bienes",
            "Entrega de bienes al depositario",
            "Realización de los bienes",
            "Mandamiento de ejecución y embargo",
            "Es la orden que emana del tribunal de requerir de pago al deudor de la suma adeudada y de embargarle bienes suficientes en caso de que no pague en ese acto.",
            "De esta manera, esta resolución debe contener la orden de que el ministro de fe requiera de pago al deudor para que en el acto del requerimiento pague la deuda con intereses, reajustes, si corresponde, y costas. A su vez, debe señalar que de no verificarse el pago en el acto de la intimación, se procederá a trabarle embargo sobre bienes suficientes. Debe contener asimismo, la firma del juez y del secretario del tribunal.",
            "El requerimiento de pago",
            "Es el acto por el cual el receptor judicial u otro ministro de fe cumplen la orden del tribunal, intimándole el mandamiento al deudor a fin de que pague la deuda.",
            "Frente al requerimiento de pago, el deudor puede tomar las siguientes actitudes:",
            "a) Si se paga la deuda antes o durante el requerimiento: Deberá hacerse cargo el deudor del pago del capital, los reajustes e intereses que procedan, y las costas.",
            "b) Si se le embargan bienes para el pago de la deuda, el deudor conserva el derecho de restituir estos bienes, pagando lo que debe.",
            "El embargo",
            "Es la aprehensión compulsiva de bienes del deudor, que un receptor judicial realiza a solicitud del Tribunal, con el fin de que posteriormente el tribunal ordene la venta o realización de estos bienes, y luego se pague con su producto al deudor.",
            "Sin embargo hay un límite establecido en el art. 447 del CPC, ya que los bienes que señalen no podrán exceder de los necesarios para responder a la demanda, haciéndose esta apreciación por el ministro de fe encargado de la diligencia, sin perjuicio de lo que pueda resolver el Tribunal.",
            "Si el acreedor no designó bienes a embargar, éste recaerá sobre los bienes que el deudor presente en el acto del embargo, si en concepto del ministro de fe encargado de la diligencia, son suficientes o si, no siéndolo tampoco hay otros conocidos (art. 448 CPC).",
            "A falta de esta designación, el ministro de fe procederá a determinar los bienes objeto del embargo en el siguiente orden: 1° El dinero; 2° Otros bienes muebles; 3° los bienes raíces; y, 4° los salarios y pensiones (art. 449 CPC).",
            "1. Bienes inembargables",
            "Entre los bienes inembargables se cuentan por ejemplo:",
            "● Los sueldos, gratificaciones y pensiones de gracia, jubilación, retiro y montepío que pagan el Estado y las Municipalidades.",
            "Las remuneraciones de los empleados y obreros (aunque son embargables en la parte que exceda de 56 UF).",
            "Las pensiones alimenticias forzosas.",
            "Los Libros relativos a la profesión del deudor hasta el valor de 50 UTM y a elección del mismo deudor.",
            "Las máquinas e instrumentos de que se sirve el deudor para la enseñanza de alguna ciencia o arte, hasta dicho valor y sujetos a la misma elección.",
            "Los objetos indispensables al ejercicio profesional del arte u oficio de los artistas, artesanos y obreros de fábricas; y los aperos, animales de labor y material de cultivo necesarios al labrador o trabajador de campo para la explotación agrícola, hasta la suma de 50 UTM y a elección del mismo deudor.",
            "Los utensilios caseros y de cocina, y los artículos de alimento y combustibles que existan en poder del deudor, hasta la concurrencia de lo necesario para el consumo de la familia durante un mes.",
            "2. Forma de efectuar el embargo",
            "El embargo se entenderá hecho por la entrega real o simbólica de los bienes al depositario que se designe, aunque éste deje la especie en poder del mismo deudor. Si el deudor no concurre a la diligencia, o si se niega a hacer la entrega al depositario, procederá a efectuarla el ministro de fe, para lo cual, cuando haya fundado temor de que la orden sea desobedecida, podrá solicitar auxilio de la fuerza pública.",
            "3. Efectos del embargo",
            "Una vez se verifica el embargo, este produce los siguientes efectos:",
            "a) Efectos respecto del ejecutante: El embargo le da derecho a pagarse con el producto resultante de la realización de esos bienes. Pero no adquiere en ningún caso derechos de dominio, de disposición, ni preferencia sobre los bienes.",
            "b) Efectos respecto del ejecutado: El efecto del embargo será la privación del derecho a administrar los bienes embargados, derecho que adquiere el depositario (art. 479 inc. 1° CPC); y pierde asimismo el derecho a disponer de los bienes ya que los bienes embargados salen del comercio humano y cualquier acto de enajenación constituye objeto ilícito (art.",
            "1.464 N° 3 del Código Civil).",
            "4. Ampliación del embargo",
            "La ampliación del embargo consiste en trabar embargo sobre nuevos bienes, luego de haberse efectuado un embargo previo, ante la insuficiencia de los bienes para cubrir el total adeudado.",
            "Puede el acreedor pedir ampliación del embargo en cualquier estado del juicio, siempre que haya justo motivo para temer que los bienes embargados no basten para cubrir la deuda y las costas",
            "5. Reducción del embargo",
            "La reducción del embargo consiste, por el contrario, en alzar el embargo sobre determinados bienes, los que a partir del alzamiento quedan excluidos.",
            "Esta reducción de embargo ocurre cuando los bienes embargados exceden de los necesarios para cubrir el total de la deuda.",
            "6. Sustitución del embargo",
            "Consiste en el reemplazo por dinero de un determinado bien embargado, y no puede sustituirse el embargo cuando éste recaiga sobre la especie objeto de la ejecución. La sustitución puede ser parcial o total y en este último caso significa el término del juicio ejecutivo.",
            "7. Exclusión del embargo",
            "Consiste en el alzamiento del embargo respecto de los bienes inembargables cuando por error éste se ha trabado sobre alguno de ellos (art. 519 inc. 2° CPC). En este caso el alzamiento se decretará a la sola solicitud del deudor.",
            "8. Cesación del embargo",
            "En este caso se alza íntegramente el embargo, lo que se puede decretar cuando el embargo se ha sustituido íntegramente por dinero, lo que equivale al pago total de la deuda y las costas.",
            "9. El reembargo",
            "Ello ocurre cuando se traban dos o más embargos sobre un mismo bien de propiedad del deudor, en virtud de diversas ejecuciones iniciadas en su contra, lo que suele ocurrir cuando el deudor acumula deudas con distintos acreedores y sus bienes no alcanzan a cubrirlas todas. En este caso, si no se justifica derecho preferente para el pago, el producto del remate se distribuirá entre todos sus acreedores, proporcionalmente al monto de los créditos que se hagan valer.",
            "Por lo tanto en estos casos de reembargo se producirá la figura de la tercería de pago, la que se describe más abajo.",
            "El depositario",
            "Es el encargado de la custodia y administración de los bienes embargados. Puede ser provisional y depositario definitivo.",
            "Por regla general el depositario provisional será el deudor, salvo que el ejecutante haya designado a un tercero en la demanda o que el ejecutante haya pedido que no se designe depositario.",
            "El depositario definitivo es el nombrado por las partes de común acuerdo en audiencia verbal, a falta de acuerdo, lo designa el tribunal.",
            "Las facultades del depositario se refieren en términos generales a la administración de los bienes embargados.",
            "A su vez, el depositario tiene las siguientes obligaciones:",
            "a) Depositar en la cuenta del Tribunal los fondos líquidos que provengan de su administración, tan pronto como cuente con ellos.",
            "b) Rendir la cuenta de su administración ante el tribunal y al final de la administración.",
            "La liquidación de los bienes",
            "La tramitación en el cuaderno principal concluirá con sentencia definitiva, bien sea absolutoria o condenatoria y, en este último caso, dicha sentencia podrá ser de pago o de remate. También podrá concluir con el certificado de no haberse opuesto excepciones a la ejecución, caso en el cual se omitirá la sentencia y bastará el mandamiento de ejecución para continuar el cobro ejecutivo.",
            "En cada uno de estos casos, la liquidación de los bienes se hace de diferente manera:",
            "a) Liquidación de los bienes cuando hay sentencia condenatoria de pago",
            "En este caso, la cosa embargada es la especie o cuerpo cierto debida o dinero.",
            "La liquidación de los bienes se hace mediante la entrega de ellos al ejecutante (art. 512 CPC).",
            "Esto puede hacerse a partir del momento en que la sentencia definitiva queda firme o ejecutoriada.",
            "Si lo embargado es dinero, deberá practicarse por el Secretario del Tribunal, a petición de cualquiera de las partes, una liquidación del crédito y regulación de las costas a pagar (art. 510 CPC). Efectuada, se notificará a las partes, las que tendrán derecho a presentar objeciones, las que se tramitarán incidentalmente.",
            "Una vez firme la liquidación, se podrá pedir el giro del cheque de los fondos consignados en la cantidad que la liquidación determine (art. 511 inc. 1° CPC), pues los fondos están depositados en la cuenta corriente del Tribunal. El cheque se emitirá a nombre del ejecutante o de su abogado si le dio facultades de percibir (art. 7° inc. 2° CPC), siendo siempre nominativos.",
            "b) Liquidación de los bienes cuando hay sentencia condenatoria de remate",
            "En este caso, la cosa embargada son bienes que deben rematarse o realizarse, para poder pagar al ejecutante.",
            "En este caso, la sentencia definitiva ordenará la realización (venta) de los bienes embargados y luego el pago al acreedor con el producido del remate, cuestión que trataremos a continuación.",
            "Para proceder al remate, basta con que se haya notificado la sentencia, sin que sea necesario esperar a que se encuentre ejecutoriada (art. 481 CPC). Pero para pagar al ejecutante, ahí sí se requiere el certificado de ejecutoria.",
            "La realización de los bienes embargados",
            "El procedimiento de realización de los bienes embargados depende del tipo de bienes de que se trate. Se distingue, principalmente, entre bienes muebles e inmuebles. Los primeros, son aquellos que pueden transportarse de un lugar a otro, sea moviéndose ellas a sí mismas, como los animales (que por eso se llaman semovientes), sea que sólo se muevan por una fuerza externa, como las cosas inanimadas. Entre estos, a su vez, se distingue entre tres tipos:",
            "● Bienes muebles sujetos a corrupción, deterioro o de difícil conservación (por ejemplo, alimentos perecederos): debe venderlos rápidamente el depositario, previa autorización judicial, sin necesidad de hacer tasación y luego, consignar el producto de la venta en la cuenta corriente del tribunal.",
            "● Bienes muebles corporales: son las que tienen un ser real y pueden ser percibidas por los sentidos, como una casa, un libro. Este tipo de bienes se venderán por martillero habilitado, designado por el tribunal, quien informará al tribunal, y éste a su vez a las partes, el día y hora de la venta. La venta se hará al mejor postor y sin necesidad de tasación, luego de lo cual rendirá cuenta del remate y consignará el producto en la cuenta corriente del tribunal.",
            "● Bienes muebles incorporales: las cosas incorporales son aquellas que consisten en derechos, como los créditos, y si estos derechos recaen en una cosa corporal mueble, entonces se reputará también como tal. Estos, atendida su inmaterialidad, deben ser previamente tasados por peritos, luego de lo cual se venderán en remate público ante el tribunal que conoce de la ejecución, o ante el tribunal en cuya jurisdicción estén situados los bienes, cuando así se resuelva a solicitud de partes y por motivos fundados. Con todo, cuando así lo disponga el tribunal, por resolución fundada, el remate podrá verificarse en forma remota.",
            "Bienes inmuebles son las cosas que no pueden transportarse de un lugar a otro; como las tierras y minas, y las que adhieren permanentemente a ellas, como los edificios, los árboles. Para la realización de estos bienes, que también se denominan bienes raíces, se seguirá el siguiente procedimiento:",
            "a) La tasación.",
            "Se tasará el inmueble con el fin de fijar un mínimo para la subasta, sea por perito o aquel valor que figure en el Rol de Avalúo Fiscal vigente.",
            "b) Bases del remate.",
            "Aprobada la tasación del bien raíz, se fijarán las bases de acuerdo a las cuales se realizará la pública subasta, fijando, entre otras bases: cauciones para participar en el remate, mínimo de posturas, las condiciones de venta, forma de pago, fecha y oportunidad de entrega del inmueble, venta ad corpus, quién paga los gastos de la venta, etc.",
            "c) Oportunidad del remate.",
            "Aprobada la tasación, se señalará día y hora para la subasta (art. 488 CPC). El remate se realiza en las dependencias del mismo Tribunal, en lo posible fuera de horario de las audiencias.",
            "d) Formalidades de publicidad.",
            "El remate, con el señalamiento del día y hora en que debe tener lugar, se anunciará por medio de avisos publicados, a lo menos por 4 veces en un diario de la comuna en que tenga su asiento el tribunal, o de la capital de la provincia o de la capital de la región, si en aquélla no lo hubiere.",
            "e) Trámites previos al remate.",
            "Los trámites previos al remate son los siguientes:",
            "i)",
            "ii)",
            "iii)",
            "f)",
            "Notificación y citación de los acreedores hipotecarios.",
            "Autorización de los acreedores embargantes o autorización judicial en su caso.",
            "Calificación de las cauciones. Todo postor, para tomar parte en un remate, deberá rendir caución suficiente, calificada por el Tribunal, sin ulterior recurso, para responder que se llevará a efecto la compra de los bienes rematados.",
            "Realización del remate.",
            "El remate es judicial, forzado, público y al mejor postor. a subasta recaerá sobre los derechos que el deudor tenga o pretenda tener sobre la cosa embargada (art. 523 inc. 2° CPC).",
            "Si llegado el momento de la subasta, no se presentan postores, podrá el acreedor solicitar cualquiera de estas dos cosas, a su elección: i) que se le adjudiquen por los dos tercios de la tasación los bienes embargados; o ii) que se reduzca prudencialmente por el tribunal el avalúo aprobado. La reducción no podrá exceder de una 3ª parte de este avalúo.",
            "g) Trámites posteriores al remate.",
            "Luego del remate se levantará acta, que será firmada por todos los concurrentes al remate, y en caso de haber habido adjudicatarios de las especies rematadas, se otorgará escritura pública de adjudicación. En caso de que el remate se verifique en forma remota, el acta deberá ser firmada por el adjudicatario mediante firma electrónica avanzada o, en su defecto, mediante firma electrónica simple.",
            "Esta acta de remate valdrá como escritura pública, para el efecto del art. 1801 del Código Civil;",
            "pero sin perjuicio de ello, deberá otorgarse dentro de 3° día la escritura pública definitiva con inserción de los antecedentes necesarios y con los demás requisitos legales.",
            "El pago al ejecutante",
            "Una vez efectuado el remate o la venta, se deben consignar los fondos en la cuenta corriente del tribunal, se debe liquidar el crédito y luego de ejecutoriada la sentencia, se debe pagar al ejecutante, salvo que exista apelación pendiente.",
            "2.4. Las tercerías",
            "En términos generales, la tercería es la intervención en el proceso de un tercero que no es parte en el juicio, pero al cual la ley le permite comparecer en tanto los efectos del proceso judicial podrían afectarle.",
            "En el contexto del juicio ejecutivo, el interés del tercero sólo puede recaer sobre el crédito que se ejecuta o sobre los bienes embargados, y sólo puede deducirse alguna de las siguientes:",
            "a) Tercería de dominio: mediante esta tercería el tercero que comparece al juicio ejecutivo alega tener derecho de propiedad o dominio por sobre los bienes embargado, solicitando así que se alce el embargo y se le reconozca su derecho.",
            "b) Tercería de posesión: es aquella por la cual un tercero ajeno al juicio ejecutivo comparece requiriendo que se alce el embargo sobre un bien que al momento de trabarse se encontraba en su posesión.",
            "c) Tercería de prelación: es aquella mediante la cual un tercero comparece en el juicio ejecutivo invocando un mejor derecho que el acreedor para pagarse con el resultado de la ejecución.",
            "d) Tercería de pago: a través de esta un tercero acreedor no privilegiado –como ocurre en la anterior– comparece en el juicio ejecutivo solicitando concurrir en el pago en producto del remato, cuando el deudor carecer de otros bienes embargables.",
            "3."
          ],

          "contenido": [
            "EL PROCEDIMIENTO SUMARIO",
            "El Procedimiento sumario es un procedimiento de carácter extraordinario y declarativo, que se aplica en aquellos casos en que la ley así lo requiere o porque a partir de la naturaleza del derecho en disputa, se requiere de una tramitación sencilla, breve y rápida para que sea eficaz, cuestión que se determina en concreto por el juez, dadas las circunstancias de la causa. Se encuentra regulado en los Artículos 680 al 692, Título XI del Libro III del Código de Procedimiento Civil.",
            "De esta manera, se trata de un procedimiento que tiene las siguientes características:",
            "a) Es un procedimiento que tiene aplicación general y especial, de acuerdo a lo que se señala a continuación.",
            "b) Es un procedimiento que está diseñado para ser oral, pero que en la práctica –y por la propia autorización de la regulación procesal– se rige por la escrituración. Ello significa que los diversos actos procesales en la práctica se tramitan por escrito y no de manera oral en audiencia, como ocurre en otros procedimientos en ámbitos reformados, como se puede observar en los capítulos siguientes.",
            "c) En este juicio, la rebeldía del demandado presume efectividad de aquello que alega el demandante.",
            "d) Es un procedimiento diseñado para ser breve y rápido, según se identifica a partir del plazo en que deben dictarse las resoluciones y por el carácter de concentrado. En razón de lo anterior, todas las cuestiones del juicio deben promoverse y tramitarse en la audiencia respectiva, sin paralizar el curso del proceso. En el mismo sentido, la sentencia definitiva debe pronunciarse sobre la acción deducida y los incidentes, o sólo sobre éstos cuando sean previos o incompatibles con la cuestión principal.",
            "3.1. Ámbitos de aplicación",
            "Aplicación general",
            "Este procedimiento tiene un ámbito de aplicación general, en virtud del cual se aplica en los casos en que la naturaleza del asunto requiera un procedimiento rápido para que sea eficaz. En virtud de lo anterior, para solicitar la aplicación del juicio sumario, se requiere justificar y acreditar al tribunal dos circunstancias:",
            "a) Que la acción requiere un procedimiento rápido para ser eficaz. Será la parte quien deberá justificar tal circunstancia, y se refiere a casos donde la urgencia o rapidez es esencial para evitar perjuicios a los derechos de quien lo solicita. Por ejemplo, podría pensarse en situaciones donde una rápida resolución es urgente para mantener una convivencia pacífica, para evitar daños patrimoniales mayores que pudieran generarse de la dilación, entre otros.",
            "En todo caso, la determinación en concreto de dicha urgencia dependerá de la apreciación del juez.",
            "b) Que no existe un procedimiento especial para la acción que se pretende deducir.",
            "Acreditadas estas circunstancias, el juez se pronunciará acogiendo o rechazando la solicitud de aplicación de este procedimiento.",
            "Aplicación especial",

            "● Aquellos en que la ley ordene proceder sumariamente, breve y sumariamente, o en otra forma análoga.",

            "3.2. Tramitación",
            "Al igual que el procedimiento ordinario, el procedimiento sumario puede comenzar mediante una medida prejudicial o directamente mediante la interposición de la demanda. Iniciado el juicio, este tendrá las siguientes etapas:",
            "Demanda y su proveído",
            "Comparendo de contestación y conciliación",
            "Recepción de la causa a prueba",
            "Trámites posteriores a la prueba",
            "Recursos",
            "Sentencia",
            "La demanda y su proveído",
            "La demanda podrá presentarse oralmente o mediante minutas escritas. En la práctica, es presentada por escrito y, por virtud de la Ley de Tramitación Electrónica, la demanda escrita es presentada a través de la Oficina Judicial Virtual.",
            "La demanda si es presentada por escrito debe cumplir, supletoriamente, con las menciones del artículo 254 del Código de Procedimiento Civil, tal como se describió para el procedimiento ordinario.",
            "Una vez deducida la demanda, si es que el tribunal la declara admisible, el tribunal citará a las partes a una audiencia que se celebrará el 5° día hábil después de la última notificación, ampliándose este plazo, si el demandado no está en el lugar del juicio, con todo el aumento que corresponda según la tabla de emplazamiento. Esta resolución se notifica personalmente al demandado, por ser la primera gestión judicial, salvo que el procedimiento haya iniciado por medida prejudicial.",
            "Comparendo de contestación y conciliación",
            "Esta audiencia tiene por objeto que el demandado pueda presentar sus alegaciones y defensas a través de su contestación, la que puede realizarse de forma verbal o escrita, que es lo que ocurrirá normalmente en la práctica. Por otro lado, sirve de oportunidad para que el tribunal llame a las partes a conciliación.",
            "A esta audiencia puede comparecer, además del demandante y demandado, el defensor público en los casos en que según la ley deba intervenir o cuando el tribunal lo juzgue necesario, y asimismo, cuando haya de oírse a los parientes, se citará en términos generales y los parientes de alguna de las partes, cuando sea necesario.",
            "De no concurrir el demandado, es decir, si se encuentra en rebeldía por no haber contestado la demanda, el actor puede solicitar con fundamento plausible a que el tribunal acceda provisionalmente a la demanda. Esta figura, es excepcionalísima en el procedimiento civil. En caso de que ello ocurra, y de comparecer luego el demandado, este puede formular oposición dentro de cinco días desde su notificación, caso en el cual el tribunal podrá citar a un nuevo comparendo.",
            "De todo lo obrado en la audiencia se levantará acta. Tanto del comparendo de contestación, como del llamado a conciliación se levantará acta. De no producirse la conciliación, o de ser ésta sólo parcial, el tribunal podrá:",
            "a) Recibir la causa a prueba.",
            "b) Citar a las partes a oír sentencia:",
            "Recepción de la causa a prueba",
            "La prueba, cuando haya lugar a ella, se rendirá en el plazo y en la forma establecida para los incidentes. De acuerdo a lo anterior, el término probatorio tendrá una duración de ocho días para que dentro de él se rinda y se justifiquen también las tachas de los testigos, si hay lugar a ellas.",
            "Dentro de los dos primeros días deberá acompañar cada parte una nómina de los testigos de que piensa valerse, con expresión del nombre y apellido, domicilio y profesión u oficio. Sólo se examinarán testigos que figuren en dicha nómina.",
            "Cuando hayan de practicarse diligencias probatorias fuera del lugar en que se sigue el juicio, podrá el tribunal, por motivos fundados, ampliar una sola vez el término por el número de días que estime necesarios, no excediendo en ningún caso del plazo total de treinta días, contados desde que se recibió el incidente a prueba.",
            "La resolución que reciba la causa a prueba determinará los puntos sobre los que deberá recaer y la recepción de los medios de prueba se hará conforme a la regulación del juicio ordinario.",
            "Trámites posteriores a la prueba",
            "Vencido el término probatorio, el tribunal, de inmediato, citará a las partes para oír sentencia.",
            "Dentro plazo para dictar sentencia en el procedimiento sumario, el tribunal podría ordenar medidas para mejor resolver, por aplicación de las normas comunes a todo procedimiento.",
            "Sentencia",
            "La sentencia deberá dictarse en el plazo de 10 días contados desde la fecha de la resolución que citó a las partes para oír sentencia. La sentencia debe cumplir con los mismos requisitos que aquellos descritos en el procedimiento ordinario, con la salvedad de que en el procedimiento sumario esta no solo se pronuncia sobre el fondo del asunto, sino también sobre incidentes.",

          "contenido": [
            "CAPÍTULO V: DE LOS PROCEDIMIENTOS ANTE LOS JUZGADOS DE FAMILIA",
            "Este capítulo se centra en los procedimientos ante los Juzgados de Familia, tribunales competentes para conocer de una serie de asuntos relacionados con esta temática, tales como alimentos, cuidado personal, relación directa y regular, violencia intrafamiliar (que no sean de competencia de los tribunales penales), entre otras. En particular, se describen tanto el procedimiento ordinario –de aplicación general– como aquellos procedimientos especiales para medidas de protección y violencia intrafamiliar.",
            "1. PROCEDIMIENTO ORDINARIO",
            "La ley establece un procedimiento ordinario aplicable ante los Juzgados de Familia, ello implica que él será el utilizado en todos aquellos asuntos en que el conflicto entre las partes corresponda a estos tribunales y no haya un procedimiento distinto establecido en la misma ley o en otras leyes.",
            "Las principales etapas de este procedimiento son las siguientes:",
            "Presentación de la demanda",
            "Citación a audiencia preparatorio",
            "Recursos",
            "Contestación de la demanda",
            "Audiencia preparatoria",
            "Sentencia",
            "Audiencia de juicio",
            "Presentación de la demanda",
            "Por regla general, el procedimiento comienza con una demanda escrita, la que deberá cumplir con todos los requisitos establecidos en el art. 254 del Código de Procedimiento Civil, ya descrito en el capítulo anterior. Excepcionalmente, el juez, por resolución fundada, podrá autorizar al demandante a interponer su demanda oralmente, de todo lo cual se levantará acta de inmediato.",
            "Tratándose de las causas en que la ley exige la mediación como trámite previo a la presentación de la demanda –derecho de alimentos, cuidado personal y el derecho de los padres e hijos e hijas que vivan separados a mantener una relación directa y regular- se deberá acompañar un certificado que acredite que se dio cumplimiento al procedimiento de mediación previo, según la ley que crea los tribunales de familia. Sin embargo, hay diversos asuntos en lo que no es necesario este trámite previo. Así ocurre, por ejemplo, con los asuntos relativos al estado civil de las personas, salvo en los casos contemplados por la Ley de Matrimonio Civil; la declaración de interdicción; las causas sobre maltrato de niños, niñas o adolescentes, y los procedimientos regulados en la ley N° 19.620 sobre adopción. Tampoco se someterán a mediación los asuntos en que una de las partes haya sido condenada por delitos constitutivos de violencia intrafamiliar o tenga anotaciones en el Registro Especial establecido en la Ley de Violencia Intrafamiliar por agredir a la otra, ni aquellos en que exista una medida cautelar de protección vigente entre las partes o una suspensión condicional de la dictación de la sentencia o del procedimiento, según corresponda.",
            "La primera notificación a la parte demandada se efectuará personalmente por un funcionario que haya sido designado para cumplir esta función por el juez presidente del comité de jueces, a propuesta del administrador del tribunal. Dicho funcionario tendrá el carácter de ministro de fe para estos efectos. Sin embargo, la parte interesada podrá siempre encargar, a su costa, la práctica de la notificación a un receptor judicial. Finalmente, si no es posible practicar la notificación de dicha manera, procede lo descrito a propósito de la notificación personal subsidiaria en el procedimiento civil.",
            "Excepcionalmente, y por resolución fundada, el juez podrá ordenar que la notificación se practique por personal de Carabineros o de la Policía de Investigaciones.",
            "Citación a audiencia preparatoria",
            "Admitida la demanda, el tribunal citará a las partes a una audiencia preparatoria, la que deberá realizarse en el más breve plazo posible. Esta resolución se notifica a ambas partes, al demandante por el estado diario electrónico o por correo electrónico, mientras que, al demandado, por tratarse normalmente de la primera notificación en el proceso, según lo que hemos revisado con anterioridad, se le notificará personalmente.",
            "La notificación de la resolución que cita a la audiencia preparatoria deberá practicarse siempre con una antelación mínima de 15 días.",
            "Contestación",
            "El demandado deberá contestar la demanda por escrito, con al menos cinco días de anticipación a la fecha de realización de la audiencia preparatoria. Si desea reconvenir, deberá hacerlo de la misma forma, conjuntamente con la contestación de la demanda y cumpliendo con todos los requisitos establecidos en el artículo 254 del Código de Procedimiento Civil. Deducida la reconvención, el tribunal la pone en conocimiento del demandante, quien podrá contestarla por escrito, u oralmente, en la audiencia preparatoria.",
            "Audiencia preparatoria",
            "El resto del procedimiento se lleva a cabo esencialmente a través de dos audiencias sucesivas: la primera de ellas, de carácter preliminar, tiene por objeto preparar adecuadamente el juicio y provocar la conciliación entre las partes y la audiencia siguiente, denominada de juicio, cuyo objeto es que en ella se rinda íntegramente la prueba, se formulen alegaciones por las partes y se dicte sentencia.",
            "La ley ha establecido diversos trámites dentro de la audiencia preparatoria. Ellos son:",
            "a) Relación breve y sintética, que harán las partes ante el juez, del contenido de la demanda, de la contestación y de la reconvención que se haya deducido, y de la contestación a la reconvención, si ha sido hecha por escrito.",
            "b) Contestar la demanda reconvencional, en su caso.",
            "c) El tribunal podrá decretar las medidas cautelares que sean necesarias.",
            "d) Promover, en los casos en que proceda, ya sea iniciativa del tribunal o a petición de parte, que las partes resuelvan el conflicto a través de mediación familiar, evento en el cual se suspenderá el procedimiento judicial hasta concluida la mediación, según lo que veremos más adelante.",
            "e) El tribunal promoverá la conciliación entre las partes, ya sea sobre todo o parte del conflicto, conforme a las bases de acuerdo que el propio tribunal proponga a las partes.",
            "f) Enseguida, el tribunal procederá a determinar el objeto del juicio, las pretensiones de las partes que serán objeto de prueba y consideradas para su resolución en la sentencia.",
            "g) Una vez fijado el objeto del juicio, el tribunal procederá a fijar los hechos que deben ser probados.",
            "h) Determinar las pruebas que deberán rendirse al tenor de la propuesta de las partes y disponer la práctica de las otras que estime necesarias.",
            "i) Excepcionalmente, y por motivos justificados, recibir la prueba que deba rendirse en ese momento.",
            "j) Fijar la fecha de la audiencia de juicio, la que deberá llevarse a efecto en un plazo no superior a treinta días de realizada la preparatoria. Sin perjuicio de ello, el juez podrá, previo acuerdo de las partes, desarrollar la audiencia de juicio inmediatamente finalizada la preparatoria.",
            "En caso de advertir la existencia de niños, niñas o adolescentes gravemente vulnerados o amenazados en sus derechos, el juez, de oficio o a petición de parte, podrá decretar la apertura del procedimiento especial previsto para la aplicación de medidas de protección y citar a la audiencia respectiva, procediendo a la acumulación necesaria, pudiendo decretar en todo caso medidas cautelares.",
            "Audiencia de juicio",
            "La audiencia de juicio es la principal actividad procesal del procedimiento de familia la que, como se ha señalado, tiene por objeto que en ella se rinda íntegramente la prueba, se formulen alegaciones por las partes y se dicte sentencia.",
            "La audiencia se llevará a efecto en un solo acto, pudiendo prorrogarse en sesiones sucesivas si fuere necesario, y tendrá por objetivo recibir la prueba admitida por el tribunal y la decretada por éste.",
            "El juez, con miras a salvaguardar el interés superior del niño, niña o adolescente, podrá ordenar que éste mismo u otro miembro del grupo familiar se ausente de la audiencia durante determinadas actuaciones.",
            "En cuanto a la producción de la prueba, ella se rendirá de acuerdo al orden que fijen las partes, comenzando por la del demandante. Rindiéndose en último término la prueba ordenada por el juez.",
            "Durante la audiencia, los testigos y peritos serán identificados por el juez, quien les tomará el juramento o promesa de decir verdad. A continuación, serán interrogados por las partes, comenzando por la que los presenta. Los peritos deberán exponer brevemente el contenido y las conclusiones de su informe y luego se autorizará su interrogatorio por las partes.",

            "CAPÍTULO VI. PROCEDIMIENTOS ANTE LOS JUZGADOS DE LETRAS DEL TRABAJO",
            "Este capítulo aborda los procedimientos ante los Juzgados de Letras del Trabajo. Estos tribunales tienen competencia para conocer de diversas controversias, entre las que se incluyen las que surgen entre empleadores y trabajadores por la aplicación de normas laborales o las derivadas de la aplicación de un contrato de trabajo, individual o colectivo, convenciones y fallos arbitrales en materia laboral. También son competentes para conocer de las controversias derivadas de la aplicación de normas referidas a la organización sindical y la negociación colectiva, así como de los juicios relativos a la aplicación de normas de previsión o de seguridad social, presentados por trabajadores activos, empleadores y pensionados (con excepción de lo relativo a la revisión de las resoluciones sobre la declaración de invalidez o del otorgamiento de licencias médicas).",
            "Finalmente, son competentes para conocer de las reclamaciones que procedan en contra de las resoluciones dictadas por la autoridad administrativa en materia laboral, previsional o de seguridad social y de los juicios en los que se pretenda hacer efectiva la responsabilidad del empleador derivada de accidentes de trabajo o enfermedades profesionales, salvo la responsabilidad extracontractual, entre otras.",
            "Este capítulo se enfoca en el procedimiento ordinario, que es de aplicación general y supletorio en todos aquellos asuntos en que el conflicto entre las partes corresponda a estos tribunales y no haya un procedimiento distinto establecido en la misma ley o en otras leyes. A continuación, se describen los procedimientos especiales que se aplican a ciertos tipos de conflictos laborales, como los conflictos colectivos y las demandas de tutela de derechos fundamentales. Estos procedimientos tienen reglas específicas que difieren del procedimiento ordinario y que, como tal, requieren ser profundizados en sus respectivos acápites.",
            "1. PROCEDIMIENTO ORDINARIO",
            "En el párrafo 3° del Capítulo II, inserto en el Título I del Libro V del Código del Trabajo, se establece un procedimiento de aplicación general u ordinario aplicable ante los Juzgados de Letras del Trabajo, el cual tiene el carácter general y supletorio.",
            "En efecto, el procedimiento ordinario es de general aplicación, ya que debe ser utilizado en todos aquellos asuntos en que el conflicto entre las partes corresponda a estos tribunales y no haya un procedimiento distinto establecido en la misma ley o en otras leyes. Así, por ejemplo, tratándose de demandas por despido injustificado o por despido indirecto, la ley no prevé un procedimiento especial, por lo cual debe aplicarse precisamente el ordinario.",
            "Asimismo, el procedimiento de aplicación general tiene un carácter supletorio, ya que, cuando esta ley u otra establecen un procedimiento especial, pero en su regulación se omiten determinados trámites, las normas sobre procedimiento ordinario se aplican también, aunque supletoriamente.",
            "El procedimiento se desarrolla en dos audiencias, la primera preparatoria y la segunda de juicio, conforme a las reglas que se explicarán más adelante. En el gráfico se observa un diagrama con los principales trámites del procedimiento ordinario aplicable ante los Juzgados de Letras del Trabajo:",
            "Demanda",
            "Notificación",
            "Audiencia preparatoria",
            "Audiencia de juicio",
            "Recursos",
            "Sentencia",
            "La demanda",
            "El procedimiento de aplicación general u ordinario comienza con la interposición de la demanda, la cual sólo puede ser presentada por escrito. Cabe señalar que, al igual como ocurre en el procedimiento ordinario civil visto anteriormente, el proceso puede comenzar también con una medida prejudicial.",
            "Recibida la demanda, el tribunal puede:",
            "a) Declararse de oficio incompetente cuando así lo estime: en este caso, debe remitir los antecedentes al tribunal que señale como competente.",
            "b) Declarar de oficio la caducidad de la acción: Puede declarar de oficio la caducidad de la acción cuando esto se desprenda claramente de los antecedentes aportados, no admitiendo a tramitación la demanda respecto de esa acción. Ello ocurrirá, por ejemplo, cuando no se haya reclamado los derechos laborales en el plazo de dos años desde que se hicieron exigibles o dentro de los seis meses si es que el contrato hubiere terminado.",
            "c) Rechazar de plano la demanda sobre materias de previsión o seguridad social: Lo anterior, cuando el demandante no adjunte la resolución final de la respectiva entidad o de la entidad fiscalizadora a la que se ha aludido precedentemente.",
            "d) Declarar admisible la demanda: En este caso, debe inmediatamente y sin más trámite, citar a las partes a una audiencia preparatoria, la que debe realizarse dentro del plazo de 35 días contados desde la resolución de citación.",
            "La notificación",
            "Admitida la demanda a tramitación, el tribunal debe, de inmediato y sin más trámite, citar a las partes a una audiencia preparatoria, fijando para tal efecto, dentro de los 35 días siguientes a la fecha de la resolución, el día y la hora para su celebración.",
            "Esta resolución se notifica a ambas partes, al demandante por el estado diario mientras que, al demandado, por tratarse normalmente de la primera notificación en el proceso, de manera personal.",
            "Esta resolución debe notificarse con a lo menos 15 días de anticipación respecto de la fecha fijada para la audiencia preparatoria.",
            "En la misma resolución que cita a audiencia preparatoria se debe hacer presente a las partes que ella se celebrará con quienes asistan, afectándole a la parte que no asiste todas las resoluciones que se dicten en la audiencia, sin necesidad de ulterior notificación. Además, se debe señalar que las partes, en dicha audiencia, deben indicar al tribunal todos los medios de prueba que pretendan hacer valer en la audiencia de juicio, como así también requerir las diligencias de prueba necesarias.",
            "Contestación y demanda reconvencional",
            "El demandado debe contestar la demanda por escrito con a lo menos 5 días de antelación a la fecha de celebración de la audiencia preparatoria.",
            "Adicionalmente, el demandado puede demandar a su vez al demandante, en cuyo caso se denominará “reconvención”, la cual sólo es procedente cuando el tribunal sea competente para conocer de ella como demanda y siempre que esté íntimamente ligada a ella.",
            "La audiencia preparatoria",
            "El resto del procedimiento se lleva a cabo esencialmente a través de dos audiencias sucesivas: la primera de ellas, de carácter preliminar, tiene por objeto fijar los puntos de discusión y provocar la conciliación entre las partes y, en su defecto, preparar adecuadamente el juicio, por lo cual se denomina preparatoria; y la audiencia siguiente, denominada de juicio, tiene por objeto que en ella se rinda íntegramente la prueba, se formulen alegaciones por las partes y se dicte sentencia.",
            "Las partes deben comparecer con patrocinio de abogado y representadas por persona legalmente habilitada para actuar en juicio, tal como se describe en el capítulo III a propósito de las normas comunes sobre comparecencia en juicio.",
            "Si ninguna de las partes asiste a la audiencia preparatoria, éstas tienen el derecho de solicitar, por una sola vez, conjunta o separadamente, dentro de quinto día contados desde la fecha en que debió efectuarse nuevo día y hora para la realización de dicha audiencia.",
            "Por aplicación del principio de concentración, la ley ha establecido diversos trámites dentro de la audiencia preparatoria. Ellos se pueden dividir en cuatro etapas:",
            "Discusión: en la audiencia preparatoria, el juez comienza por brindar una somera relación de los contenidos de la demanda, así como de la contestación y, en su caso, de la demanda reconvencional y de las excepciones, para luego dar paso al demandado para la contestación de la demanda reconvencional y de las excepciones, en su caso. De tratarse de excepciones como la incompetencia del tribunal o la falta de capacidad del demandante, el tribunal deberá resolverlas en ese mismo momento. Otro tipo de excepciones quedan para ser resueltas en la sentencia definitiva.",
            "Conciliación: terminada la etapa de discusión, el juez llamará a las partes a conciliación, a cuyo objeto deberá proponerles las bases para un posible acuerdo, sin que las opiniones que emita al efecto sean causal de inhabilitación.",
            "Preparación de la prueba: contestada la demanda, sin que se haya opuesto reconvención o excepciones dilatorias, o evacuado el traslado conferido de haberse interpuesto éstas, el tribunal recibirá de inmediato la causa a prueba, cuando ello fuere procedente, fijándose los hechos a ser probados.",
            "En el caso de estimar que no hay hechos sustanciales, pertinentes y controvertidos sobre los que rendir prueba, el tribunal dará por concluida la audiencia y procederá a dictar sentencia.",
            "Durante esta etapa, el juez resolverá fundadamente en el acto sobre la pertinencia de la prueba ofrecida por las partes, pudiendo valerse de todas aquellas reguladas en la ley. Las partes podrán también ofrecer cualquier otro elemento de convicción que, a juicio del tribunal, fuese pertinente.",
            "Cierre: por último, el tribunal debe fijar la fecha para la audiencia de juicio, la que debe llevarse a cabo en un plazo no superior a 30 días de realizada la audiencia preparatoria. Las partes se entienden citadas a esta audiencia por el solo ministerio de la ley. Además de lo anterior, el tribunal decretará las medidas cautelares que correspondan y despachará todas las citaciones y oficios que correspondan cuando se haya ordenado la práctica de prueba que, debiendo verificarse en la audiencia de juicio, requieran citación o requerimiento.",
            "La audiencia de juicio",
            "La audiencia se debe llevar a efecto en un solo acto, y tiene por objetivo recibir la prueba admitida por el tribunal y la decretada por éste. El día y hora fijados, las partes - al igual que en la audiencia preparatoria- deben comparecer representadas por persona legalmente habilitada para actuar en juicio, es decir, mediante mandatario judicial.",
            "Por aplicación del principio de concentración, la ley ha establecido diversos trámites dentro de la audiencia de juicio. Ellos son:",
            "a) La audiencia de juicio se inicia con la rendición de las pruebas decretadas por el tribunal, comenzando con la ofrecida por el demandante y luego con la del demandado, salvo en los juicios sobre despido, en cuyo caso corresponde la rendición de la prueba en primer lugar al demandado.",
            "b) El orden establecido por la ley para la recepción de las pruebas es el siguiente: i) documental;",
            "ii) confesional; iii) testimonial; y, iv) los otros medios ofrecidos. Cabe señalar que el tribunal puede modificarlos por causa justificada.",
            "c) Practicada la prueba, las partes pueden formular, oralmente, en forma breve y precisa, las observaciones que les merezcan las pruebas y sus conclusiones. La ley faculta al juez para pedir a las partes que aclaren los puntos oscuros de sus observaciones.",
            "d) Al finalizar la audiencia debe levantarse un acta, en la que debe constar el lugar, fecha e individualización del tribunal, de las partes comparecientes, de sus apoderados y abogados, y de toda otra circunstancia que el tribunal estime necesario incorporar.",
            "De esta manera, la audiencia de juicio sigue el siguiente esquema:",
            "Rendición de prueba del demandante (se altera en juicio de despido)",
            "Rendición de prueba del demandado",
            "Documental",
            "Documental",
            "Confesional",
            "Confesional",
            "Testimonial",
            "Testimonial",
            "Otros",
            "Otros",
            "Observaciones a la prueba",
            "Acta",
            "Fallo o citación para conocer el fallo",
            "La sentencia",
            "Para resolver el asunto sometido a su conocimiento, el tribunal debe apreciar la prueba conforme a las reglas de la sana crítica, esto es, debe expresar las razones jurídicas y simplemente lógicas, científicas, técnicas o de experiencia, en cuya virtud les asigne valor o las desestime.",
            "El juez puede pronunciar la sentencia al término de la audiencia de juicio o dictarla dentro del plazo de 15 días contados desde la realización de la audiencia.",
            "La sentencia debe pronunciarse sobre las acciones y excepciones deducidas que no se hayan resuelto con anterioridad y sobre los incidentes, en su caso.",
            "Como se señaló anteriormente, excepcionalmente el juez puede dictar sentencia en la audiencia preparatoria. En estos casos, la sentencia puede omitir la síntesis de los hechos y las alegaciones de las partes, así como el análisis de la prueba rendida, los hechos que estime probados y el razonamiento que conduzca a esta estimación.",
            "Los recursos",
            "a) Recurso de reposición",
            "Se interpone frente al mismo tribunal que dicta una resolución y es él quien la resuelve.",
            "En contra de la resolución dictada en audiencia, la reposición debe interponerse en forma verbal, inmediatamente después de pronunciada la resolución que se impugna.",
            "En contra de la resolución dictada fuera de audiencia, debe presentarse dentro de tercero día de notificada la resolución correspondiente, a menos que dentro de dicho término tenga lugar una audiencia, en cuyo caso debe interponerse a su inicio.",
            "En aquellas ocasiones en que se presente en audiencia debe ser resuelta en el acto.",
            "b) Recurso de apelación",
            "Procede en contra de sentencias interlocutorias que pongan término al juicio o hagan imposible su continuación, las que se pronuncien sobre medidas cautelares y las que fijen el monto de las liquidaciones o reliquidaciones de beneficios de seguridad social.",
            "c) Recurso de nulidad",
            "El recurso de nulidad tiene por finalidad invalidar el procedimiento total o parcialmente junto con la sentencia definitiva, o sólo esta última, según corresponda.",
            "Procede sólo en contra de sentencias definitivas cuando en la tramitación del procedimiento o en la dictación de la sentencia definitiva se hayan infringido sustancialmente derechos o garantías constitucionales, o aquélla se haya dictado con infracción de ley que hubiere influido sustancialmente en lo dispositivo del fallo.",
            "El recurso de nulidad debe interponerse por escrito, ante el tribunal que dictó la resolución que se impugna, dentro del plazo de 10 días contados desde la notificación respectiva a la parte que lo entabla, para que sea conocido por la respectiva Corte de Apelaciones.",
            "Debe expresar el vicio que se reclama, la infracción de garantías constitucionales o de ley de que adolece, según corresponda, y en este caso, además, señalar de qué modo dichas infracciones de ley influyen sustancialmente en lo dispositivo del fallo.",
            "d) Recurso de unificación de jurisprudencia",
            "Este recurso procede cuando respecto de la materia de derecho objeto del juicio existen distintas interpretaciones sostenidas en uno o más fallos firmes emanados de Tribunales Superiores de Justicia.",
            "En cuanto a su tramitación, cabe señalar que éste debe interponerse ante la Corte de Apelaciones correspondiente en el plazo de 15 días desde la notificación de la sentencia que se recurre, para que sea conocido por la Corte Suprema.",
            "La interposición del recurso no suspende el cumplimiento forzado de la resolución recurrida, salvo cuando ello haga imposible llevar a efecto la que se dicte si se llega a acoger el recurso. En razón de lo anterior, la parte vencida puede solicitar que se suspenda la ejecución mientras la parte vencedora no rinda garantía suficiente (que toma el nombre de “fianza de resultas”) a satisfacción de la Corte correspondiente. Con estos fines, el recurrente debe ejercer este derecho conjuntamente con la interposición del recurso y en solicitud separada. La Corte, por su parte, al declarar admisible el recurso, debe pronunciarse de plano sobre la petición antes señalada.",
            "La sala especializada de la Corte Suprema sólo puede declarar inadmisible el recurso por la unanimidad de sus miembros, mediante resolución fundada, si no se cumplió en el plazo para su interposición y carece de fundamento en las causales invocadas. Dicha resolución sólo puede ser objeto de recurso de reposición dentro de quinto día.",
            "El fallo que se pronuncie sobre el recurso sólo tiene efecto respecto de la causa respectiva, y en ningún caso afecta a las situaciones jurídicas fijadas en las sentencias que le sirven de antecedente."
          ],

            "En relación al procedimiento propiamente tal, este es distinto según se trate del cumplimiento de la sentencia definitiva ejecutoriada o para el resto de los títulos ejecutivos laborales.",
            "En el primer caso, el procedimiento se inicia con la certificación por parte del tribunal que la dictó de su carácter de firme –es decir que no quedan recursos pendientes en su contra–, y siempre que no se acredite su cumplimiento dentro de los cinco días siguientes, luego de lo cual se iniciará la ejecución de oficio. Para ello, el tribunal remitirá los antecedentes al Juzgado de Cobranza Laboral y Previsional competente, quien continuará con la ejecución. Recibidos estos antecedentes, dicho tribunal remite a la unidad correspondiente a cargo de llevar a cabo la liquidación del monto adeudado, incluyendo capital, intereses y costas, lo que deberá practicarse dentro de tercero día y será notificada a las partes, junto con el requerimiento al ejecutado para que pague u objete dentro de los cinco días siguientes. La parte ejecutada, por su lado, solo puede oponerse presentando antecedentes escritos de alguna de las siguientes excepciones: pago de la deuda, remisión, novación y transacción. Si el empleador persiste en su incumplimiento desechada que sea su oposición o luego de la notificación antes descrita si es que no la hubo, el juzgado podrá ordenar medidas de apremio, como el embargo de bienes, la retención de fondos, entre otras medidas que aseguren el cumplimiento de la sentencia. Finalmente, en caso de ser necesario, se procederá a la realización de los bienes embargados para obtener el pago de la deuda.",

            "PROCEDIMIENTO DE TUTELA LABORAL",
            "Los derechos asegurados constitucionalmente no desaparecen en el entorno laboral, se conservan, aun cuando ello suponga en ciertos casos establecer un equilibrio adecuado para la consecución de los fines propios de la relación de trabajo.",
            "Para garantizar que tales disposiciones no constituyan una mera declaración de principios, el legislador ha establecido un procedimiento específico a los asuntos que se susciten en una relación laboral que afecten derechos fundamentales de los trabajadores con ocasión del ejercicio, por parte del empleador, de las facultades que les concede la ley.",

            "De esta manera, el procedimiento de tutela laboral tiene por objeto conocer y resolver los asuntos que se susciten en una relación laboral que afecten ciertos derechos fundamentales de los trabajadores, siendo incompatible con el recurso de protección.",
            "Para estos efectos, se entiende este procedimiento aplicable a todos los trabajadores, incluidos aquellos a los que hace referencia el inciso segundo del artículo 1° del Código del Trabajo.",
            "También serán aplicables a los trabajadores que se desempeñen en los órganos señalados en los Capítulos VII, VIII, IX, X y XIII de la Constitución Política de la República y a aquellos que sus propias leyes declaren como autónomos.",
            "Derechos Fundamentales protegidos",

            "a) El derecho a la vida y a la integridad física y psíquica (19 N° 1 inc. 1° de la Constitución), siempre que la vulneración sea consecuencia directa de actos ocurridos en la relación laboral.",
            "b) Respeto y protección a la vida privada y a la honra de la persona y su familia (19 N° 4 de la Constitución).",
            "c) La inviolabilidad de toda forma de comunicación privada (19 N° 5 de la Constitución).",
