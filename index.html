<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("datos").textContent);
  var app = document.getElementById("app");
  var CLAVE = "manual-unico-progreso";
  var letras = "ABCDEFGH";

  // Per-viewer progress only. Every access is guarded: storage may be blocked.
  function leerProgreso(){
    try { return JSON.parse(localStorage.getItem(CLAVE)) || {intentos:0, aciertos:0}; }
    catch(e){ return {intentos:0, aciertos:0}; }
  }
  function registrar(ok){
    var p = leerProgreso(); p.intentos++; if(ok) p.aciertos++;
    try { localStorage.setItem(CLAVE, JSON.stringify(p)); } catch(e){}
  }

  function el(tag, attrs, hijos){
    var n = document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if(k === "text") n.textContent = v;
      else if(typeof v === "function") n.addEventListener(k.replace(/^on/, ""), v);
      else if(v === false || v === null || v === undefined) return;
      else if(v === true) n.setAttribute(k, "");
      else n.setAttribute(k, v);
    });
    (hijos || []).forEach(function(h){ if(h) n.append(h); });
    return n;
  }
  function barajar(a){
    return a.map(function(x){ return [Math.random(), x]; })
            .sort(function(p,q){ return p[0]-q[0]; })
            .map(function(p){ return p[1]; });
  }
  function capsulaPorId(id){
    var out = null;
    D.capitulos.forEach(function(c){ c.capsulas.forEach(function(k){ if(k.id === id) out = {cap:c, cs:k}; }); });
    return out;
  }
  function tituloCap(id){
    var r = capsulaPorId(id); return r ? r.cap.id + " · " + r.cs.titulo : "";
  }

  function fijarVista(v){
    if(contra && !contra.terminado && v !== "contra") terminarContra("Saliste del reto antes de terminar.");
    document.querySelectorAll(".tabs button").forEach(function(b){
      if(b.dataset.vista === v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    window.scrollTo(0,0);
  }
  function montar(nodos){
    app.replaceChildren.apply(app, nodos.filter(Boolean));
  }

  // Shared question renderer.
  // cfg.inmediato: true shows feedback right away (study); false only records the answer (challenge).
  // cfg.alElegir(ok, q) and cfg.siguiente() are callbacks.
  function tarjetaPregunta(q, cfg){
    var elegida = null;
    var lista = el("div", {class:"opciones"});
    var caja = el("div", {});
    var mezcla = barajar(q.opciones.map(function(t,i){ return {t:t, i:i}; }));
    var botones = [];

    mezcla.forEach(function(op, n){
      var b = el("button", {class:"opcion", type:"button", text: letras[n] + ") " + op.t});
      b.onclick = function(){
        if(elegida !== null) return;
        elegida = op.i;
        botones.forEach(function(x){ x.disabled = true; });
        var ok = op.i === q.correcta;
        if(cfg.inmediato){
          mezcla.forEach(function(m, k){
            if(m.i === q.correcta) botones[k].classList.add("bien");
          });
          if(!ok) b.classList.add("mal");
          caja.append(el("div", {class:"retro " + (ok ? "bien" : "mal"), role:"status"}, [
            el("strong", {text: ok ? "¡Correcta!" : "Incorrecta."}),
            el("p", {text: q.explicacion + (ok ? "" : " La respuesta correcta es: «" + q.opciones[q.correcta] + "»."), style:"margin:0"}),
            el("p", {class:"nota", text: "Referencia: " + q.referencia, style:"margin:6px 0 0"})
          ]));
          registrar(ok);
          if(cfg.alElegir) cfg.alElegir(ok, q);
          caja.append(el("div", {class:"row"}, [
            el("button", {class:"btn", type:"button", text: cfg.textoSiguiente || "Siguiente", onclick: cfg.siguiente})
          ]));
        } else {
          if(cfg.alElegir) cfg.alElegir(ok, q, op.i);
          if(cfg.siguiente) cfg.siguiente();
        }
      };
      botones.push(b); lista.append(b);
    });

    return el("section", {}, [
      el("p", {class:"meta", text: q.referencia ? q.referencia : ""}),
      el("h2", {text: q.pregunta}),
      lista, caja
    ]);
  }

  // Capsule checklist and progress. A capsule is complete once its questions are all answered.
  function leerCapsulas(){
    var p = leerProgreso();
    return p.capsulas || {};
  }
  function marcarCapsula(id, aciertos, total){
    var p = leerProgreso();
    p.capsulas = p.capsulas || {};
    var previo = p.capsulas[id];
    var pct = Math.round(100 * aciertos / total);
    p.capsulas[id] = {completa: true, mejor: Math.max(pct, previo ? previo.mejor : 0)};
    try { localStorage.setItem(CLAVE, JSON.stringify(p)); } catch(e){}
  }
  function totalCapsulas(){
    var t = 0; D.capitulos.forEach(function(c){ t += c.capsulas.length; });
    return t;
  }
  function estadoCap(id){
    var e = leerCapsulas()[id];
    return e && e.completa ? "Completada. Mejor resultado: " + e.mejor + " %." : "Pendiente. Responde todas las preguntas para marcarla como completada.";
  }
  function barraProgreso(){
    var estado = leerCapsulas(), hechas = 0;
    Object.keys(estado).forEach(function(k){ if(estado[k].completa) hechas++; });
    var total = totalCapsulas(), pct = Math.round(100 * hechas / total);
    return el("div", {class:"bloque-progreso"}, [
      el("p", {class:"nota", style:"margin:0 0 6px", text:"Tu progreso: " + hechas + " de " + total + " cápsulas (" + pct + " %)"}),
      el("div", {class:"segmentos", role:"progressbar", "aria-valuemin":"0", "aria-valuemax":String(total), "aria-valuenow":String(hechas)},
        Array.from({length: total}, function(_, k){ return el("i", {class: k < hechas ? "hecho" : ""}); }))
    ]);
  }

  // Bolds the key phrases of a capsule. Longest phrase first so overlapping phrases still match.
  function resaltar(texto, claves){
    if(!claves.length) return [document.createTextNode(texto)];
    var ord = claves.slice().sort(function(a,b){ return b.length - a.length; });
    var rx = new RegExp("(" + ord.map(function(c){ return c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")", "g");
    return texto.split(rx).map(function(parte, i){
      return i % 2 ? el("strong", {text: parte}) : document.createTextNode(parte);
    });
  }

  // ----- Inicio -----
  function vistaInicio(){
    fijarVista("inicio");
    var p = leerProgreso();
    var pct = p.intentos ? Math.round(100 * p.aciertos / p.intentos) + " %" : "—";
    var totalCap = 0; D.capitulos.forEach(function(c){ totalCap += c.capsulas.length; });
    montar([
      el("h1", {text:"Estudio del Manual Único"}),
      el("p", {class:"lead", text:"Estudia por cápsulas, rinde el reto de 20 preguntas o practica sin límite."}),
      el("div", {class:"stats"}, [
        el("div", {class:"stat"}, [el("b", {text:String(D.banco.length)}), el("span", {text:"preguntas en el banco"})]),
        el("div", {class:"stat"}, [el("b", {text:String(totalCap)}), el("span", {text:"cápsulas de estudio"})]),
        el("div", {class:"stat"}, [el("b", {text: pct}), el("span", {text:"aciertos (" + p.intentos + " respondidas)"})])
      ]),
      barraProgreso(),
      el("a", {class:"card tap", href:"Manual_Unico_2025.pdf", download:"Manual_Unico_2025.pdf"}, [
        el("h3", {text:"Descargar el manual (PDF)"}), el("p", {class:"lead", style:"margin:0", text:"Manual Único para Tribunales, octubre 2025, para leerlo completo."})
      ]),
      el("button", {class:"card tap", type:"button", onclick:function(){ vistaCapsulas(); }}, [
        el("h3", {text:"Estudiar por cápsulas"}), el("p", {class:"lead", style:"margin:0", text:"Elige un capítulo, lee su cápsula y responde sus preguntas con retroalimentación."})
      ]),
      el("button", {class:"card tap", type:"button", onclick:function(){ vistaReto(); }}, [
        el("h3", {text:"Reto de 20 preguntas"}), el("p", {class:"lead", style:"margin:0", text:"Un examen de práctica con preguntas tomadas al azar. La corrección aparece al final."})
      ]),
      el("button", {class:"card tap", type:"button", onclick:function(){ vistaContra(); }}, [
        el("h3", {text:"Reto contrarreloj"}), el("p", {class:"lead", style:"margin:0", text:"Un minuto para sumar puntos: +1 por acierto y -1 por error. Tres errores terminan el reto."})
      ]),
      el("button", {class:"card tap", type:"button", onclick:function(){ vistaLibre(); }}, [
        el("h3", {text:"Práctica sin límites"}), el("p", {class:"lead", style:"margin:0", text:"Preguntas sin fin, con retroalimentación inmediata. Puedes filtrar por capítulo."})
      ])
    ]);
  }

  // ----- Cápsulas -----
  function vistaCapsulas(){
    fijarVista("capsulas");
    var estado = leerCapsulas();
    var nodos = [el("h1", {text:"Cápsulas de estudio"}), el("p", {class:"lead", text:"Selecciona un capítulo y luego una cápsula. ✓ indica las cápsulas completadas."}), barraProgreso()];
    D.capitulos.forEach(function(c, idx){
      var lista = el("ul", {hidden: idx !== 0});
      c.capsulas.forEach(function(k){
        lista.append(el("li", {}, [el("button", {type:"button", onclick:function(){ vistaCapsula(k.id); }}, [
          el("span", {text: (estado[k.id] && estado[k.id].completa ? "✓ " : "○ ") + k.titulo, style:"display:block;font-weight:600"}),
          el("span", {text: n(k.id) + " preguntas", style:"display:block;font-size:.85rem;color:var(--muted)"})
        ])]));
      });
      var boton = el("button", {type:"button", "aria-expanded": idx === 0 ? "true" : "false"}, [
        el("strong", {text:"Capítulo " + c.id + ". " + c.titulo}),
        el("span", {text: c.capsulas.filter(function(k){ return estado[k.id] && estado[k.id].completa; }).length + " de " + c.capsulas.length + " completadas"})
      ]);
      boton.onclick = function(){
        var abierto = lista.hidden;
        lista.hidden = !abierto;
        boton.setAttribute("aria-expanded", String(abierto));
      };
      nodos.push(el("div", {class:"acordeon"}, [boton, lista]));
    });
    montar(nodos);
    function n(id){ return D.banco.filter(function(q){ return q.capsula === id; }).length; }
  }

  // Vista de la cápsula: true muestra solo las oraciones con frases clave, false el texto completo.
  var capsulaResumida = true;

  // Oraciones textuales del manual que contienen alguna frase clave, en su orden original.
  function resumenCapsula(cs){
    var claves = cs.claves || [];
    var salida = [];
    cs.contenido.forEach(function(parrafo){
      var oraciones = parrafo.indexOf("● ") === 0 ? [parrafo] : (parrafo.match(/[\s\S]+?(?:\.(?=\s+[A-ZÁÉÍÓÚÑ"“(¿0-9]|$)|$)/g) || []).map(function(o){ return o.trim(); });
      oraciones.forEach(function(o){
        if(!o) return;
        var tiene = claves.some(function(c){ return o.indexOf(c) >= 0; }) || (cs.base || []).indexOf(o) >= 0;
        if(tiene && salida.indexOf(o) < 0) salida.push(o);
      });
    });
    return salida.length ? salida : cs.contenido.slice(0, 1);
  }

  function vistaCapsula(id){
    fijarVista("capsulas");
    var r = capsulaPorId(id);
    if(!r) return vistaCapsulas();
    var preguntas = D.banco.filter(function(q){ return q.capsula === id; });
    var textos = capsulaResumida ? resumenCapsula(r.cs) : r.cs.contenido;
    montar([
      el("p", {class:"meta", text:"Capítulo " + r.cap.id + " · " + r.cap.titulo}),
      el("h1", {text: r.cs.titulo}),
      (r.cs.comentario ? el("div", {class:"comentario", text: r.cs.comentario}) : null),
      el("p", {class:"nota", text:"Fuente: Manual Único (Corporación Administrativa del Poder Judicial, 2025), " + r.cs.fuente + ", capítulo " + r.cap.id + "."}),
      el("p", {class:"nota", text: estadoCap(id)}),
      el("div", {class:"row"}, [
        el("button", {class:"btn ghost", type:"button", text: capsulaResumida ? "Ver texto completo" : "Ver resumen", onclick:function(){ capsulaResumida = !capsulaResumida; vistaCapsula(id); }})
      ]),
      el("p", {class:"nota", text: capsulaResumida ? "Resumen: oraciones textuales del manual con las frases clave en negrita." : "Texto completo del manual."}),
      el("div", {class:"contenido"}, textos.map(function(t){ return el("p", {}, resaltar(t, r.cs.claves || [])); })),
      el("div", {class:"row"}, [
        el("button", {class:"btn", type:"button", text: preguntas.length ? "Responder " + preguntas.length + " preguntas" : "Sin preguntas aún", disabled: !preguntas.length, onclick:function(){ vistaEstudio(id); }}),
        el("button", {class:"btn ghost", type:"button", text:"Volver a cápsulas", onclick:vistaCapsulas})
      ])
    ]);
  }

  // Id of the capsule that follows this one in reading order, or null at the end of the manual.
  function siguienteCapsula(id){
    var orden = [];
    D.capitulos.forEach(function(c){ c.capsulas.forEach(function(k){ orden.push(k.id); }); });
    var pos = orden.indexOf(id);
    return pos >= 0 && pos < orden.length - 1 ? orden[pos + 1] : null;
  }

  function vistaEstudio(id){
    var siguiente = siguienteCapsula(id);
    var preguntas = barajar(D.banco.filter(function(q){ return q.capsula === id; }));
    var i = 0, aciertos = 0;
    var barra = el("i");
    function paso(){
      if(i >= preguntas.length){
        var pct = Math.round(100 * aciertos / preguntas.length);
        marcarCapsula(id, aciertos, preguntas.length);
        montar([
          el("h1", {text:"Resultado"}),
          el("p", {text:"Acertaste " + aciertos + " de " + preguntas.length + " (" + pct + " %)."}),
          el("div", {class:"row"}, [
            siguiente ? el("button", {class:"btn", type:"button", text:"Ir a la siguiente cápsula", onclick:function(){ vistaCapsula(siguiente); }}) : null,
            el("button", {class:"btn " + (siguiente ? "ghost" : ""), type:"button", text:"Volver a la cápsula", onclick:function(){ vistaCapsula(id); }}),
            el("button", {class:"btn ghost", type:"button", text:"Repetir", onclick:function(){ vistaEstudio(id); }})
          ])
        ]);
        return;
      }
      var q = preguntas[i];
      var prog = el("div", {class:"progreso"}, [barra]);
      barra.style.width = (100 * i / preguntas.length) + "%";
      montar([
        el("p", {class:"meta", text: "Pregunta " + (i+1) + " de " + preguntas.length + " · " + tituloCap(id)}),
        prog,
        tarjetaPregunta(q, {
          inmediato: true,
          alElegir: function(ok){ if(ok) aciertos++; },
          siguiente: function(){ i++; paso(); }
        })
      ]);
    }
    fijarVista("capsulas");
    paso();
  }

  // ----- Reto 20 -----
  var reto = null;
  function vistaReto(){
    fijarVista("reto");
    if(reto && !reto.terminado){ return pasoReto(); }
    if(reto && reto.terminado){ return resultadoReto(); }
    var total = D.banco.length;
    var n = Math.min(20, total);
    montar([
      el("h1", {text:"Reto de 20 preguntas"}),
      el("p", {text:"Se toman " + n + " preguntas al azar del banco. No verás la respuesta correcta hasta terminar."}),
      total < 20 ? el("p", {class:"nota", text:"El banco tiene " + total + " preguntas, así que el reto usará todas ellas."}) : null,
      el("p", {class:"nota", text:"Puedes salir y volver: el reto queda en curso mientras esta pestaña siga abierta."}),
      el("div", {class:"row"}, [
        el("button", {class:"btn", type:"button", text:"Comenzar reto", onclick:function(){ iniciarReto(n); }})
      ])
    ]);
  }
  function iniciarReto(n){
    reto = {preguntas: barajar(D.banco).slice(0, n), i:0, respuestas:[], inicio: Date.now(), terminado:false, tick:null};
    reto.tick = setInterval(function(){ var t = document.getElementById("cronometro"); if(t) t.textContent = formato(Date.now() - reto.inicio); }, 1000);
    pasoReto();
  }
  function formato(ms){
    var s = Math.floor(ms/1000), m = Math.floor(s/60); s = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function pasoReto(){
    var r = reto;
    if(r.i >= r.preguntas.length){ return terminarReto(); }
    var q = r.preguntas[r.i];
    montar([
      el("div", {class:"row", style:"justify-content:space-between"}, [
        el("span", {class:"meta num", text:"Pregunta " + (r.i+1) + " de " + r.preguntas.length}),
        el("span", {id:"cronometro", class:"num", text: formato(Date.now() - r.inicio)})
      ]),
      el("div", {class:"progreso"}, [el("i", {style:"width:" + (100 * r.i / r.preguntas.length) + "%"})]),
      tarjetaPregunta(q, {
        inmediato: false,
        textoSiguiente: r.i === r.preguntas.length - 1 ? "Terminar" : "Siguiente",
        alElegir: function(ok, pregunta, elegidaIdx){ r.respuestas[r.i] = {q: pregunta, elegida: elegidaIdx, ok: ok}; },
        siguiente: function(){ r.i++; pasoReto(); }
      })
    ]);
  }
  function terminarReto(){
    var r = reto; r.terminado = true; clearInterval(r.tick);
    var aciertos = 0;
    r.respuestas.forEach(function(x){ if(x && x.ok){ aciertos++; registrar(true); } else if(x){ registrar(false); } });
    resultadoReto();
  }
  function resultadoReto(){
    var r = reto;
    var aciertos = r.respuestas.filter(function(x){ return x && x.ok; }).length;
    var total = r.preguntas.length;
    var fallos = r.respuestas.filter(function(x){ return x && !x.ok; });
    var nodos = [
      el("h1", {text:"Resultado del reto"}),
      el("p", {text:"Acertaste " + aciertos + " de " + total + " (" + Math.round(100*aciertos/total) + " %). Tiempo: " + formato(Date.now() - r.inicio) + "."}),
      el("div", {class:"row"}, [
        el("button", {class:"btn", type:"button", text:"Nuevo reto", onclick:function(){ reto = null; vistaReto(); }}),
        el("button", {class:"btn ghost", type:"button", text:"Volver al inicio", onclick:vistaInicio})
      ])
    ];
    if(fallos.length){
      nodos.push(el("h2", {text:"Preguntas para repasar (" + fallos.length + ")"}));
      fallos.forEach(function(x){
        var q = x.q;
        nodos.push(el("div", {class:"card"}, [
          el("p", {class:"meta", text: q.referencia}),
          el("p", {text: q.pregunta, style:"font-weight:600"}),
          el("p", {class:"nota", style:"margin:0", text:"Tu respuesta: " + q.opciones[x.elegida]}),
          el("p", {style:"margin:4px 0 0", text:"Correcta: " + q.opciones[q.correcta]}),
          el("p", {class:"nota", style:"margin:4px 0 0", text: q.explicacion})
        ]));
      });
    } else {
      nodos.push(el("p", {text:"Sin errores. Muy bien."}));
    }
    montar(nodos);
  }

  // ----- Reto contrarreloj -----
  var CONTRA_SEG = 60000, CONTRA_MAX_ERRORES = 3;
  var contra = null;
  var contraCap = "todos";
  function preguntasContra(){
    return D.banco.filter(function(q){
      if(contraCap === "todos") return true;
      var r = capsulaPorId(q.capsula);
      return r && "cap-" + r.cap.id === contraCap;
    });
  }
  function filtrosContra(){
    var filtros = el("div", {class:"fila-chip"});
    [["todos","Todos"]].concat(D.capitulos.map(function(c){ return ["cap-"+c.id, "Cap. " + c.id]; })).forEach(function(f){
      var b = el("button", {class:"chip", type:"button", "aria-pressed": String(contraCap === f[0]), text: f[1]});
      b.onclick = function(){ contraCap = f[0]; vistaContra(); };
      filtros.append(b);
    });
    return filtros;
  }
  function vistaContra(){
    fijarVista("contra");
    if(contra && !contra.terminado){ return pasoContra(); }
    montar([
      el("h1", {text:"Reto contrarreloj"}),
      el("p", {text:"Tienes 1 minuto. Cada acierto suma 1 punto y cada error resta 1. Con " + CONTRA_MAX_ERRORES + " errores el reto termina."}),
      el("p", {class:"nota", text:"Al responder pasas directo a la siguiente pregunta. Si sales de esta pestaña, el reto termina con los puntos que tengas."}),
      el("p", {class:"meta", text:"Capítulo"}),
      filtrosContra(),
      preguntasContra().length ? null : el("p", {class:"nota", text:"Este capítulo aún no tiene preguntas en el banco."}),
      el("div", {class:"row"}, [
        el("button", {class:"btn", type:"button", text:"Comenzar", disabled: !preguntasContra().length, onclick:iniciarContra})
      ])
    ]);
  }
  function iniciarContra(){
    contra = {preguntas: barajar(preguntasContra()), i:0, puntos:0, aciertos:0, errores:0, respuestas:[], fin: Date.now() + CONTRA_SEG, tick:null, terminado:false, motivo:""};
    contra.tick = setInterval(function(){
      var resta = contra.fin - Date.now();
      if(resta <= 0) return terminarContra("Se acabó el tiempo.");
      var t = document.getElementById("cronometro-contra"); if(t) t.textContent = formato(resta);
    }, 250);
    pasoContra();
  }
  function pasoContra(){
    var c = contra;
    if(c.i >= c.preguntas.length) return terminarContra("No quedan más preguntas en el banco.");
    var q = c.preguntas[c.i];
    montar([
      el("div", {class:"row", style:"justify-content:space-between"}, [
        el("span", {class:"meta num", text:"Puntos: " + c.puntos}),
        el("span", {id:"cronometro-contra", class:"num", text: formato(Math.max(0, c.fin - Date.now()))})
      ]),
      el("div", {class:"corazones", role:"img", "aria-label":"Errores: " + c.errores + " de " + CONTRA_MAX_ERRORES}, Array.from({length: CONTRA_MAX_ERRORES}, function(_, k){ return corazon(k < c.errores); })),
      tarjetaPregunta(q, {
        inmediato: false,
        alElegir: function(ok, pregunta, elegidaIdx){
          c.respuestas.push({q: pregunta, elegida: elegidaIdx, ok: ok});
          c.puntos += ok ? 1 : -1;
          if(ok) c.aciertos++; else c.errores++;
          registrar(ok);
          flashPunto(ok);
        },
        siguiente: function(){
          if(c.errores >= CONTRA_MAX_ERRORES) return terminarContra("Llegaste a " + CONTRA_MAX_ERRORES + " errores.");
          c.i++; pasoContra();
        }
      })
    ]);
  }
  // Corazón de píxeles tipo Minecraft: cada error vacía uno.
  var CORAZON = [[1,0,2],[4,0,2],[0,1,7],[0,2,7],[1,3,5],[2,4,3],[3,5,1]];
  function corazon(vacio){
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 7 6");
    svg.setAttribute("class", "corazon " + (vacio ? "vacio" : "lleno"));
    svg.setAttribute("aria-hidden", "true");
    CORAZON.forEach(function(r){
      var rect = document.createElementNS(ns, "rect");
      rect.setAttribute("x", r[0]); rect.setAttribute("y", r[1]);
      rect.setAttribute("width", r[2]); rect.setAttribute("height", 1);
      svg.append(rect);
    });
    return svg;
  }
  function flashPunto(ok){
    var f = el("div", {class:"flash-punto " + (ok ? "bien" : "mal"), text: ok ? "+1" : "-1"});
    document.body.append(f);
    setTimeout(function(){ f.remove(); }, 800);
  }
  function terminarContra(motivo){
    if(!contra || contra.terminado) return;
    contra.terminado = true; contra.motivo = motivo; clearInterval(contra.tick);
    resultadoContra();
  }
  function resultadoContra(){
    var c = contra;
    var fallos = c.respuestas.filter(function(x){ return !x.ok; });
    var nodos = [
      el("h1", {text:"Resumen del reto contrarreloj"}),
      el("p", {class:"num", style:"font:700 56px/1 var(--display);margin:8px 0", text: "Puntos: " + c.puntos}),
      el("p", {text: c.motivo + " Acertaste " + c.aciertos + ", fallaste " + c.errores + " y respondiste " + c.respuestas.length + (c.respuestas.length === 1 ? " pregunta." : " preguntas.")}),
      el("div", {class:"row"}, [
        el("button", {class:"btn", type:"button", text:"Nuevo reto", onclick:function(){ contra = null; vistaContra(); }}),
        el("button", {class:"btn ghost", type:"button", text:"Volver al inicio", onclick:vistaInicio})
      ])
    ];
    if(fallos.length){
      nodos.push(el("h2", {text:"Preguntas para repasar (" + fallos.length + ")"}));
      fallos.forEach(function(x){
        var q = x.q;
        nodos.push(el("div", {class:"card"}, [
          el("p", {class:"meta", text: q.referencia}),
          el("p", {text: q.pregunta, style:"font-weight:600"}),
          el("p", {class:"nota", style:"margin:0", text:"Tu respuesta: " + q.opciones[x.elegida]}),
          el("p", {style:"margin:4px 0 0", text:"Correcta: " + q.opciones[q.correcta]}),
          el("p", {class:"nota", style:"margin:4px 0 0", text: q.explicacion})
        ]));
      });
    }
    montar(nodos);
  }

  // ----- Práctica sin límites -----
  var libre = {capitulo:"todos", ultimo:null};
  function vistaLibre(){
    fijarVista("libre");
    var filtros = el("div", {class:"fila-chip"});
    [["todos","Todos"]].concat(D.capitulos.map(function(c){ return ["cap-"+c.id, "Cap. " + c.id]; })).forEach(function(f){
      var b = el("button", {class:"chip", type:"button", "aria-pressed": String(libre.capitulo === f[0]), text: f[1]});
      b.onclick = function(){ libre.capitulo = f[0]; vistaLibre(); };
      filtros.append(b);
    });
    var contenedor = el("div", {});
    montar([
      el("h1", {text:"Práctica sin límites"}),
      el("p", {class:"lead", text:"Preguntas al azar, con retroalimentación inmediata."}),
      filtros, el("div", {style:"height:12px"}), contenedor
    ]);
    siguienteLibre(contenedor);
  }
  function siguienteLibre(contenedor){
    var pool = D.banco.filter(function(q){
      if(libre.capitulo === "todos") return true;
      var cap = libre.capitulo.replace("cap-", "");
      var r = capsulaPorId(q.capsula);
      return r && r.cap.id === cap;
    });
    if(!pool.length){
      contenedor.replaceChildren(el("p", {text:"Este capítulo aún no tiene preguntas en el banco."}));
      return;
    }
    var q = pool[Math.floor(Math.random()*pool.length)];
    if(pool.length > 1 && libre.ultimo && q.id === libre.ultimo.id){
      q = pool[(pool.indexOf(q) + 1) % pool.length];
    }
    libre.ultimo = q;
    contenedor.replaceChildren(tarjetaPregunta(q, {
      inmediato: true,
      textoSiguiente: "Otra pregunta",
      siguiente: function(){ siguienteLibre(contenedor); }
    }));
  }

  // ----- Preguntas de examen -----
  var EXAMEN = JSON.parse(document.getElementById("examen").textContent);
  var examen = {i: 0};
  function vistaExamen(){
    fijarVista("examen");
    var contenedor = el("div", {});
    montar([
      el("h1", {text:"Preguntas de examen"}),
      el("p", {class:"lead", text:"Preguntas transcritas de la rendición del examen Manual Único del 30-01-2025, en el orden del examen. Las respuestas son propuestas según el manual y están en revisión."}),
      el("p", {class:"nota", text:"Pregunta " + (examen.i + 1) + " de " + EXAMEN.length}),
      contenedor
    ]);
    siguienteExamen(contenedor);
  }
  function siguienteExamen(contenedor){
    var q = EXAMEN[examen.i];
    contenedor.replaceChildren(tarjetaPregunta(q, {
      inmediato: true,
      textoSiguiente: examen.i + 1 < EXAMEN.length ? "Siguiente pregunta" : "Volver a empezar",
      siguiente: function(){ examen.i = (examen.i + 1) % EXAMEN.length; vistaExamen(); }
    }));
  }

  // Navigation
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.onclick = function(){
      var v = b.dataset.vista;
      if(v === "inicio") vistaInicio();
      if(v === "capsulas") vistaCapsulas();
      if(v === "reto") vistaReto();
      if(v === "libre") vistaLibre();
      if(v === "examen") vistaExamen();
    };
  });
  vistaInicio();
})();
</script>
</body>
</html>
